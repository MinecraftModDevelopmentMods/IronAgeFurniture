# Reproducible Gradle and NeoGradle configuration.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.configuration-cache=false
org.gradle.caching=true
org.gradle.parallel=false
# NeoForm 26.1.2 can exhaust the decompiler when it processes all classes in
# parallel. A single worker with an explicit heap produces a complete, runtime-safe jar.
neogradle.subsystems.decompiler.enabled=true
neogradle.subsystems.decompiler.maxMemory=8g
neogradle.subsystems.decompiler.maxThreads=1

# Project and release identity.
