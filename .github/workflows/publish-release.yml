name: Publish IronAgeFurniture release
run-name: Publish IronAgeFurniture ${{ inputs.release_ref }} (${{ inputs.curseforge_channel }})

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing four-component release tag on master-1.10.
        required: true
        type: string
      confirm_version:
        description: Re-enter the exact version to confirm the requested release.
        required: true
        type: string
      curseforge_channel:
        description: CurseForge channel.
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha
      confirm_live_publication:
        description: Confirm sequential Maven, CurseForge, and GitHub publication.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: iron-age-furniture-release-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate exact branch, version, tag, commit, and CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
      release_version: ${{ steps.validate.outputs.release_version }}
      minecraft_version: ${{ steps.validate.outputs.minecraft_version }}
      curseforge_project_id: ${{ steps.validate.outputs.curseforge_project_id }}
      main_jar: ${{ steps.validate.outputs.main_jar }}
      sources_jar: ${{ steps.validate.outputs.sources_jar }}
      javadoc_jar: ${{ steps.validate.outputs.javadoc_jar }}

    steps:
      - name: Check out requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Validate release request
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "MinecraftModDevelopmentMods/IronAgeFurniture" ]]; then
            echo 'Publication is restricted to MinecraftModDevelopmentMods/IronAgeFurniture.' >&2
            exit 1
          fi
          value() { sed -n "s/^$1=//p" gradle.properties; }
          release_version="$(value mod_version)"
          minecraft_version="$(value minecraft_version)"
          loader_name="$(value loader_name)"
          loader_code="$(value loader_code)"
          curseforge_project_id="$(value curseforge_project_id)"
          mod_group="$(value mod_group)"
          archive_name="$(value mod_archive_name)"

          if [[ "$RELEASE_REF" != "$release_version" || "$CONFIRM_VERSION" != "$release_version" ]]; then
            echo "Requested ref and confirmation must both equal $release_version" >&2
            exit 1
          fi
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.([0-9]+)$ ]]; then
            echo 'Release version must have four numeric components.' >&2
            exit 1
          fi
          version_target="${BASH_REMATCH[1]}"
          IFS=. read -r mc_major mc_minor mc_patch extra <<<"$minecraft_version"
          mc_patch="${mc_patch:-0}"
          if [[ -n "${extra:-}" || ! "$mc_major" =~ ^[0-9]+$ \
              || ! "$mc_minor" =~ ^[0-9]+$ || ! "$mc_patch" =~ ^[0-9]+$ ]]; then
            echo "Invalid minecraft_version=$minecraft_version" >&2
            exit 1
          fi
          printf -v minor_padded '%02d' "$((10#$mc_minor))"
          printf -v patch_padded '%02d' "$((10#$mc_patch))"
          target_suffix="${mc_major}${minor_padded}${patch_padded}${loader_code}"
          if [[ "$version_target" != "$target_suffix" || "$loader_name:$loader_code" != 'forge:1' ]]; then
            echo "Version target or loader metadata is inconsistent: $release_version / $loader_name:$loader_code" >&2
            exit 1
          fi
          if [[ "$curseforge_project_id" != '341834' \
              || "$mod_group:$archive_name" != 'com.mcmoddev.ironagefurniture:iron-age-furniture' ]]; then
            echo 'Publication identity is inconsistent.' >&2
            exit 1
          fi

          git fetch --no-tags origin '+refs/heads/master-1.10:refs/remotes/origin/master-1.10'
          release_sha="$(git rev-parse "refs/tags/$RELEASE_REF^{commit}")"
          branch_sha="$(git rev-parse refs/remotes/origin/master-1.10)"
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$release_sha" != "$branch_sha" || "$release_sha" != "$checkout_sha" ]]; then
            echo "Tag, checkout, and origin/master-1.10 must identify one commit." >&2
            exit 1
          fi
          successful_ci="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$release_sha/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "Build, test, and audit" and .conclusion == "success")] | length')"
          if [[ "$successful_ci" -lt 1 ]]; then
            echo 'The exact release commit has no successful Build, test, and audit check.' >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_REF" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_REF already exists." >&2
            exit 1
          fi

          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$minecraft_version" >> "$GITHUB_OUTPUT"
          echo "curseforge_project_id=$curseforge_project_id" >> "$GITHUB_OUTPUT"
          echo "main_jar=$archive_name-$release_version.jar" >> "$GITHUB_OUTPUT"
          echo "sources_jar=$archive_name-$release_version-sources.jar" >> "$GITHUB_OUTPUT"
          echo "javadoc_jar=$archive_name-$release_version-javadoc.jar" >> "$GITHUB_OUTPUT"

  build:
    name: Build immutable release bundle
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.bundle.outputs.artifact_name }}

    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0

      - name: Install Java 8 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "8.0.502+7"

      - name: Install Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build and audit once
        run: |
          chmod +x ./gradlew
          ./gradlew clean check build javadoc verifyReleaseArtifacts verifyReleaseChecksums \
            --no-daemon --stacktrace

      - name: Stage exact immutable bundle
        id: bundle
        env:
          MAIN_JAR: ${{ needs.preflight.outputs.main_jar }}
          SOURCES_JAR: ${{ needs.preflight.outputs.sources_jar }}
          JAVADOC_JAR: ${{ needs.preflight.outputs.javadoc_jar }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/release-bundle"
          mkdir -p "$bundle"
          cp "build/libs/$MAIN_JAR" "$bundle/"
          cp "build/libs/$SOURCES_JAR" "$bundle/"
          cp "build/libs/$JAVADOC_JAR" "$bundle/"
          cp build/release/SHA256SUMS "$bundle/"
          cp CHANGELOG.md "$bundle/"
          mapfile -t jars < <(find "$bundle" -maxdepth 1 -type f -name '*.jar' -printf '%f\n' | sort)
          expected=("$JAVADOC_JAR" "$SOURCES_JAR" "$MAIN_JAR")
          IFS=$'\n' expected=($(printf '%s\n' "${expected[@]}" | sort))
          [[ "${jars[*]}" == "${expected[*]}" ]]
          (cd "$bundle" && sha256sum --check SHA256SUMS)
          echo "artifact_name=iron-age-furniture-${{ needs.preflight.outputs.release_sha }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/release-bundle/*

  publish:
    name: Publish Maven, CurseForge, then GitHub
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out validated publication definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0

      - name: Install Java 8 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "8.0.502+7"

      - name: Install Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-input

      - name: Revalidate authorization, ref, CI, artifact list, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_LIVE_PUBLICATION: ${{ inputs.confirm_live_publication }}
          RELEASE_REF: ${{ inputs.release_ref }}
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          MAIN_JAR: ${{ needs.preflight.outputs.main_jar }}
          SOURCES_JAR: ${{ needs.preflight.outputs.sources_jar }}
          JAVADOC_JAR: ${{ needs.preflight.outputs.javadoc_jar }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MAVEN_UPLOAD_URL: ${{ secrets.MAVEN_UPLOAD_URL }}
          MAVEN_UPLOAD_USERNAME: ${{ secrets.MAVEN_UPLOAD_USERNAME }}
          MAVEN_UPLOAD_PASSWORD: ${{ secrets.MAVEN_UPLOAD_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM_LIVE_PUBLICATION" == 'true' ]]
          for name in CURSEFORGE_TOKEN MAVEN_UPLOAD_URL MAVEN_UPLOAD_USERNAME MAVEN_UPLOAD_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Missing release secret $name" >&2; exit 1; }
          done
          [[ "$MAVEN_UPLOAD_URL" != file:* ]]
          git fetch origin '+refs/heads/master-1.10:refs/remotes/origin/master-1.10' \
            "+refs/tags/$RELEASE_REF:refs/tags/$RELEASE_REF"
          [[ "$(git rev-parse refs/remotes/origin/master-1.10)" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_REF^{commit}")" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          successful_ci="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "Build, test, and audit" and .conclusion == "success")] | length')"
          [[ "$successful_ci" -ge 1 ]]
          cd "$RUNNER_TEMP/release-input"
          mapfile -t jars < <(find . -maxdepth 1 -type f -name '*.jar' -printf '%f\n' | sort)
          expected=("$JAVADOC_JAR" "$SOURCES_JAR" "$MAIN_JAR")
          IFS=$'\n' expected=($(printf '%s\n' "${expected[@]}" | sort))
          [[ "${jars[*]}" == "${expected[*]}" ]]
          sha256sum --check SHA256SUMS

      - name: Publish Maven first
        env:
          MAVEN_UPLOAD_URL: ${{ secrets.MAVEN_UPLOAD_URL }}
          MAVEN_UPLOAD_USERNAME: ${{ secrets.MAVEN_UPLOAD_USERNAME }}
          MAVEN_UPLOAD_PASSWORD: ${{ secrets.MAVEN_UPLOAD_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew publishMavenJavaPublicationToReleaseRepository \
            -PpreparedReleaseDir="$RUNNER_TEMP/release-input" --no-daemon --stacktrace

      - name: Publish CurseForge second
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: ${{ needs.preflight.outputs.curseforge_project_id }}
          name: Iron Age Furniture ${{ needs.preflight.outputs.release_version }} for Minecraft ${{ needs.preflight.outputs.minecraft_version }}
          version: ${{ needs.preflight.outputs.release_version }}
          version-type: ${{ inputs.curseforge_channel }}
          changelog-file: ${{ runner.temp }}/release-input/CHANGELOG.md
          loaders: forge
          game-versions: ${{ needs.preflight.outputs.minecraft_version }}
          game-version-filter: none
          environment: client | server
          java: Java 8
          fail-mode: fail
          files: |
            ${{ runner.temp }}/release-input/${{ needs.preflight.outputs.main_jar }}
            ${{ runner.temp }}/release-input/${{ needs.preflight.outputs.sources_jar }}
            ${{ runner.temp }}/release-input/${{ needs.preflight.outputs.javadoc_jar }}

      - name: Publish GitHub Release last
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          github-token: ${{ github.token }}
          github-tag: ${{ inputs.release_ref }}
          github-commitish: ${{ needs.preflight.outputs.release_sha }}
          github-draft: false
          github-prerelease: false
          name: Iron Age Furniture ${{ needs.preflight.outputs.release_version }} for Minecraft ${{ needs.preflight.outputs.minecraft_version }}
          version: ${{ needs.preflight.outputs.release_version }}
          version-type: release
          changelog-file: ${{ runner.temp }}/release-input/CHANGELOG.md
          fail-mode: fail
          files: |
            ${{ runner.temp }}/release-input/${{ needs.preflight.outputs.main_jar }}
            ${{ runner.temp }}/release-input/${{ needs.preflight.outputs.sources_jar }}
            ${{ runner.temp }}/release-input/${{ needs.preflight.outputs.javadoc_jar }}
            ${{ runner.temp }}/release-input/SHA256SUMS
