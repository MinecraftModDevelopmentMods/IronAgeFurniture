name: CodeQL

on:
  push:
    branches:
      - master-1.10
      - "feature/**"
  pull_request:
    branches:
      - master-1.10
  schedule:
    - cron: "43 7 * * 4"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out pinned OreSpawn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/OreSpawn
          ref: 5a50df1158e948c8db55814e819090b34c12d765
          path: .ci-dependencies/OreSpawn

      - name: Check out pinned Power Advantage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/PowerAdvantage
          ref: 88e9818b4b7011a430436b40367fb1609073875b
          path: .ci-dependencies/PowerAdvantage

      - name: Install pinned Java 25 Mavenizer runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25.0.3+9.0.LTS"

      - name: Install Java 8 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "8.0.502+7"

      - name: Install Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build and test pinned Power Advantage fluid API
        id: poweradvantage
        shell: bash
        run: |
          set -euo pipefail
          dependency_root="$GITHUB_WORKSPACE/.ci-dependencies"
          orespawn="$dependency_root/OreSpawn"
          poweradvantage="$dependency_root/PowerAdvantage"
          chmod +x "$orespawn/gradlew" "$poweradvantage/gradlew"
          (cd "$orespawn" && ./gradlew deobfJar --no-daemon --stacktrace)
          orespawn_jar="$orespawn/build/libs-dev/OreSpawn-4.0.8.110021-deobf.jar"
          test -f "$orespawn_jar"
          (cd "$poweradvantage" && ./gradlew \
            test --tests cyano.poweradvantage.api.fluid.FluidNetworkApiTest deobfJar \
            -PoreSpawnDeobfJar="$orespawn_jar" --no-daemon --stacktrace)
          poweradvantage_jar="$poweradvantage/build/libs-dev/PowerAdvantage-2.4.3.110021-deobf.jar"
          test -f "$poweradvantage_jar"
          echo "jar=$poweradvantage_jar" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: java-kotlin

      - name: Compile production code
        run: |
          chmod +x ./gradlew
          ./gradlew clean classes --no-daemon --stacktrace \
            -PpowerAdvantageDeobfJar="${{ steps.poweradvantage.outputs.jar }}" \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME_25_X64,$JAVA_HOME_8_X64,$JAVA_HOME" \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
