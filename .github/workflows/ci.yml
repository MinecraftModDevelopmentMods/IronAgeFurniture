name: IronAgeFurniture 26.3 NeoForge CI

on:
  push:
    branches:
      - master-26.3-neo
      - 'feature/**'
  pull_request:
    branches:
      - master-26.3-neo

permissions:
  contents: read

concurrency:
  group: iron-age-furniture-26.3-neoforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-bootstrap:
    name: Cold NeoForge bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install exact Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Bootstrap an isolated empty NeoGradle cache
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          test ! -d .gradle
          export GRADLE_USER_HOME="$RUNNER_TEMP/iron-age-furniture-neoforge-cold-cache"
          rm -rf "$GRADLE_USER_HOME"
          gradle_jdk_args=(
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME"
            -Dorg.gradle.java.installations.auto-detect=false
            -Dorg.gradle.java.installations.auto-download=false
          )
          ./gradlew help --no-daemon --no-build-cache --stacktrace --max-workers=2 "${gradle_jdk_args[@]}"
          ./gradlew help --offline --no-daemon --no-build-cache --stacktrace --max-workers=2 "${gradle_jdk_args[@]}"

  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install exact Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build, test, document, and audit
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          gradle_jdk_args=(
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME"
            -Dorg.gradle.java.installations.auto-detect=false
            -Dorg.gradle.java.installations.auto-download=false
          )
          ./gradlew clean --no-daemon --stacktrace --max-workers=2 "${gradle_jdk_args[@]}"
          ./gradlew check build javadoc verifyReleaseArtifacts writeReleaseChecksums verifyReleaseChecksums \
            --no-daemon --stacktrace --max-workers=2 "${gradle_jdk_args[@]}"
      - name: Generate and audit Eclipse production launches
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew eclipse verifyEclipseProductionClasspath \
            --no-daemon --stacktrace --max-workers=2 \
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME" \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false
      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iron-age-furniture-26.3-neoforge-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/iron-age-furniture-0.3.0.2603002.jar
            build/libs/iron-age-furniture-0.3.0.2603002-sources.jar
            build/libs/iron-age-furniture-0.3.0.2603002-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.md
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iron-age-furniture-26.3-neoforge-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/problems/**
            run/logs/**
