modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/MinecraftModDevelopmentMods/IronAgeFurniture/issues"

[[mixins]]
config="ironagefurniture.mixins.json"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/iron-age-furniture"
credits="Cyanobacterium, SkyBlade1978, FoxNekitsune, the MMD Team, NeoForge, FML, and the mod authors"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.ironagefurniture]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.ironagefurniture]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.ironagefurniture]]
    modId="biomesoplenty"
    type="optional"
    versionRange="[21.11.0.31,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.ironagefurniture]]
    modId="biomeswevegone"
    type="optional"
    versionRange="[4.4.0,)"
    ordering="AFTER"
    side="BOTH"
