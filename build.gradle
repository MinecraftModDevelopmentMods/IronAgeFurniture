tasks.register('verifyRepositoryHygiene') {
    group = 'verification'
    description = 'Rejects tracked generated output, IDE state, secrets, legacy CI, and machine paths.'
    doLast {
        byte[] trackedBytes = providers.exec {
            commandLine 'git', 'ls-files', '-z'
        }.standardOutput.asBytes.get()
        List<String> tracked = new String(trackedBytes, StandardCharsets.UTF_8)
                .split('\u0000').findAll { !it.isEmpty() }
        Set<String> forbiddenDirectories = [
                '.agent', '.agents', '.ci-dependencies', '.claude', '.codex', '.eclipse',
                '.gradle', '.gradle-home', '.idea', '.metadata', '.settings', 'agent-notes',
                'bin', 'build', 'classes', 'crash-reports', 'eclipse', 'evidence', 'logs',
                'mcmodsrepo', 'out', 'reports', 'run', 'run-data', 'test-output', 'test-results'
        ] as Set<String>
        Set<String> forbiddenFiles = [
                '.classpath', '.project', '.travis.yml', 'agent.md', 'agents.md',
                'local.properties', 'secret.json'
        ] as Set<String>
        List<String> forbidden = tracked.findAll { path ->
            List<String> segments = path.tokenize('/')
            String fileName = segments.last().toLowerCase(Locale.ROOT)
            List<String> parents = segments.size() > 1 ? segments[0..-2] : []
            parents.any { forbiddenDirectories.contains(it.toLowerCase(Locale.ROOT)) }
                    || forbiddenFiles.contains(fileName)
                    || fileName ==~ /(?:agent|codex)-.*\.md/
                    || ['.launch', '.keystore', '.jks', '.p12', '.jfr', '.hprof', '.log']
                            .any { fileName.endsWith(it) }
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("Tracked generated, IDE, legacy CI, or secret files: ${forbidden}")
        }
        tracked.findAll { path ->
            String fileName = new File(path).name
            file(path).isFile() && (archiveTextSuffixes.any { fileName.endsWith(it) }
                    || ['.gitattributes', '.gitignore', 'gradlew'].contains(fileName))
        }.each { path ->
            String contents = file(path).getText('UTF-8')
            if (contents ==~ /(?s).*(?:[A-Za-z]:[\\\/]Users[\\\/]|\/home\/[^\/]+\/).*/) {
                throw new GradleException("Tracked text file contains an absolute machine path: ${path}")
            }
        }
    }
}

tasks.register('verifyResourceJson') {
    group = 'verification'
    description = 'Parses resources and validates locale parity and optional-integration conditions.'
    doLast {
        List<File> jsonFiles = fileTree('src/main/resources') {
            include '**/*.json'
            include 'pack.mcmeta'
        }.files.sort { it.path }
        if (jsonFiles.size() != 15048) {
            throw new GradleException("Expected 15048 runtime JSON documents, found ${jsonFiles.size()}")
        }
        jsonFiles.each { candidate ->
            try {
                new JsonSlurper().parseText(candidate.getText('UTF-8').replaceFirst(/^\uFEFF/, ''))
            } catch (Exception ex) {
                throw new GradleException("Invalid resource JSON: ${candidate}", ex)
            }
        }
        List<String> localeNames = ['en_en.json', 'en_gb.json', 'en_us.json']
        List<Map> locales = localeNames.collect { name ->
            new JsonSlurper().parse(file("src/main/resources/assets/ironagefurniture/lang/${name}")) as Map
        }
        if (!locales.every { it.size() == 7062 }
                || !locales.tail().every { it.keySet() == locales.first().keySet() }) {
            throw new GradleException('English locale files must retain 7062 identical translation keys')
        }

        Map<String, Map<String, Integer>> optionalIntegrations = optionalIntegrationExpectedCounts
        def hasModLoadedCondition = { Object conditions, String modId ->
            conditions instanceof List && conditions.any { condition ->
                condition instanceof Map && condition.type == 'forge:mod_loaded'
                        && condition.modid == modId
            }
        }
        File recipeRoot = file('src/main/resources/data/ironagefurniture/recipes')
        File advancementRoot = file('src/main/resources/data/ironagefurniture/advancements')
        Map<File, Map> recipeDocuments = fileTree(recipeRoot) { include '**/*.json' }.files.collectEntries {
            [(it): new JsonSlurper().parse(it) as Map]
        }
        Map<File, Map> advancementDocuments = fileTree(advancementRoot) { include '**/*.json' }.files.collectEntries {
            [(it): new JsonSlurper().parse(it) as Map]
        }
        if (recipeDocuments.any { recipeFile, recipe -> recipe.type == 'forge:conditional' }) {
            throw new GradleException('Optional recipes must use top-level conditions, not forge:conditional, ' +
                    'because an unmet wrapper condition is logged once per recipe at info level')
        }
        optionalIntegrations.each { modId, expectedCounts ->
            Set<File> recipes = recipeDocuments.findAll { recipeFile, recipe ->
                hasModLoadedCondition(recipe.conditions, modId)
            }.keySet()
            if (recipes.size() != expectedCounts.recipes) {
                throw new GradleException("Expected ${expectedCounts.recipes} ${modId} recipes, " +
                        "found ${recipes.size()}")
            }
            recipes.each { recipeFile ->
                Map recipe = recipeDocuments[recipeFile]
                if (!(recipe.type instanceof String) || recipe.type == 'forge:conditional'
                        || !(recipe.conditions instanceof List) || recipe.conditions.size() != 1
                        || !hasModLoadedCondition(recipe.conditions, modId)) {
                    throw new GradleException(
                            "Optional recipe lacks one top-level forge:mod_loaded condition for ${modId}: " +
                                    recipeFile)
                }
            }

            Set<File> advancements = advancementDocuments.findAll { advancementFile, advancement ->
                advancement.advancements instanceof List && advancement.advancements.size() == 1
                        && hasModLoadedCondition(advancement.advancements[0].conditions, modId)
            }.keySet()
            if (advancements.size() != expectedCounts.advancements) {
                throw new GradleException("Expected ${expectedCounts.advancements} ${modId} advancements, " +
                        "found ${advancements.size()}")
            }
            advancements.each { advancementFile ->
                Map wrapper = advancementDocuments[advancementFile]
                if (wrapper.keySet() != ['advancements'] as Set
                        || !(wrapper.advancements instanceof List)
                        || wrapper.advancements.size() != 1
                        || !hasModLoadedCondition(wrapper.advancements[0].conditions, modId)
                        || !(wrapper.advancements[0].advancement instanceof Map)) {
                    throw new GradleException(
                            "Optional advancement lacks a forge:mod_loaded condition for ${modId}: " +
                                    advancementFile)
                }
            }
        }
        int conditionalRecipeCount = optionalIntegrations.values().sum { it.recipes } as int
        int conditionalAdvancementCount = optionalIntegrations.values().sum { it.advancements } as int
        logger.lifecycle('Validated {} resource JSON documents, {} locale keys, {} conditional recipes, ' +
                        'and {} conditional advancements.', jsonFiles.size(), locales.first().size(),
                conditionalRecipeCount, conditionalAdvancementCount)
    }
}

tasks.register('verifyNamespace') {
    group = 'verification'
    description = 'Requires the maintained Java namespace while preserving the runtime mod namespace.'
    doLast {
        String legacyPackage = 'com.mcmoddev.ironagefurniture'
        String maintainedPackage = 'zone.moddev.mc.ironagefurniture'
        String maintainedPath = "src/main/java/${maintainedPackage.replace('.', '/')}/"
        List<File> sources = fileTree('src/main/java') { include '**/*.java' }.files.sort { it.path }
        if (sources.size() != 118) {
            throw new GradleException("Expected 118 production Java sources, found ${sources.size()}")
        }
        sources.each { sourceFile ->
            String relativePath = project.relativePath(sourceFile).replace('\\', '/')
            String contents = sourceFile.getText('UTF-8').replaceFirst(/^\uFEFF/, '')
            if (!relativePath.startsWith(maintainedPath) || contents.contains(legacyPackage)) {
                throw new GradleException("Legacy or misplaced IronAgeFurniture source: ${relativePath}")
            }
            def packageMatch = contents =~ /(?m)^package\s+([^;]+);/
            if (!packageMatch.find()) {
                throw new GradleException("Java source has no package declaration: ${relativePath}")
            }
            String expectedPackage = relativePath.substring('src/main/java/'.length(),
                    relativePath.lastIndexOf('/')).replace('/', '.')
            if (packageMatch.group(1) != expectedPackage) {
                throw new GradleException("Package/path mismatch in ${relativePath}: ${packageMatch.group(1)}")
            }
        }
        ['assets/ironagefurniture', 'data/ironagefurniture'].each { path ->
            if (!file("src/main/resources/${path}").isDirectory()) {
                throw new GradleException("Persistent resource namespace is missing: ${path}")
            }
        }
    }
}

tasks.register('verifyVersionMetadata') {
    group = 'verification'
    description = 'Checks authoritative version and generated Forge metadata.'
    dependsOn tasks.named('processResources')
    doLast {
        String source = file(
                'src/main/java/zone/moddev/mc/ironagefurniture/Ironagefurniture.java').getText('UTF-8')
