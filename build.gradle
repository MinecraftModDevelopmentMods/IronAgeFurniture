plugins {
    id "java"
    id "idea"
    id "eclipse"
    id "maven-publish"
    id "net.minecraftforge.renamer" version "1.1.5"
    id "net.minecraftforge.gradle" version "[7.0.29,8.0)"
}

def tag = providers.environmentVariable("TAG")
def isPreviewBuild = tag.orNull?.matches(".+-.+") ?: false
def buildNumber = tag.orElse(providers.environmentVariable("BUILD_NUMBER").map { "build.${it}" })

// Format the tag to include the Minecraft version if a tag is present
def formattedTag = tag.map { t -> "${minecraft_version}-${t}" }

version = formattedTag.orElse(provider {
    def result = "${minecraft_version}-${mod_version}-development"
    if (isPreviewBuild && !tag.isPresent()) {
        result += buildNumber.map { "+${it}" }.getOrElse("")
    }
    return result
}).get()

println "Building ${project.name}-${version}"

group = mod_group
base.archivesName = mod_archive_name

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
    withSourcesJar()
    withJavadocJar()
}

minecraft {
    //For use with FG 7 on older MC versions
    //MCP Stable versions list: <https://maven.minecraftforge.net/releases/de/oceanlabs/mcp/mcp_stable/maven-metadata.xml>
    //MCP Snapshot versions list: <https://maven.minecraftforge.net/releases/de/oceanlabs/mcp/mcp_snapshot/maven-metadata.xml>
    //Formatted like so:
    // mappings channel: "stable", version: "29-1.10.2"
    mappings channel: mappings_channel, version: mappings_version

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir("run")

            systemProperty "forge.logging.console.level", "debug"
            systemProperty "eventbus.api.strictRuntimeChecks", "true"
        }

        register('client') {
            if (project.hasProperty("mc_username")) {
                args "--username", mc_username
            }
            if (project.hasProperty("mc_uuid")) {
                args "--uuid", mc_uuid
            }
        }

        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter {
            includeGroupAndSubgroups('org.spongepowered')
        }
    }
    mavenCentral()
    mavenLocal()

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // NOTE: Support for local dependencies is still experimental in ForgeGradle 7.
    //flatDir {
    //    dir 'libs'
    //}

    maven {
        name = "Mod Dev Zone Maven (Hosts the MMD Maven too)"
        url = "https://maven.moddev.zone/"
    }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    implementation minecraft.dependency("net.minecraftforge:forge:$minecraft_version-$forge_version")

    // Minecraft 1.10.2 exposes lwjgl_util types (for example Vector3f through
    // ItemTransformVec3f), but the legacy Mavenizer metadata puts this jar on
    // the runtime classpath only. Keep it compile-only because Forge already
    // supplies the same library at runtime.
    compileOnly "org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209"

    // Forge 1.21.6+ uses EventBus 7, which shifts most of its runtime validation to compile-time via an annotation processor
    // to improve performance in production environments. This line is required to enable said compile-time validation
    // in your development environment, helping you catch issues early.
    //annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    //compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    //compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    //runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // NOTE: Support for deobfuscated dependencies has not yet been added in ForgeGradle 7.
    //implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
        mod_version                         : mod_version,
        mod_name                            : mod_name,
        mod_id                              : mod_id,
        mod_description                     : mod_description,
        curseforge_url                      : "https://mods.cf/${project.curseforge_id}",
        update_url                          : update_url,
        mod_license                         : mod_license,
        mod_authors                         : mod_authors,

        minecraft_version                   : minecraft_version,
        forge_version                       : forge_version
    ]
    inputs.property('replaceProperties', replaceProperties)

    filesMatching(['mcmod.info']) {
        expand replaceProperties
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar) {
    archiveClassifier = "dev"
    manifest {
        attributes([
            "Specification-Title"     : mod_id,
            "Specification-Vendor"    : mod_authors,
            "Specification-Version"   : '1', // We are version 1 of ourselves
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : mod_authors
        ])
        //attributes['MixinConfigs'] = "${mod_id}.mixins.json"
    }
}

// Set the default mappings file to our default minecraft dependency
// This must be done after `minecraft.dependency('coords')` has been done so that gradle knows what dependency we want
// This mapping will be used by default for all renamer tasks, including deobfuscating dependencies
// You can still override each specific task, this is just to save repeating yourself in your buildscript.
renamer.mappings.from minecraft.dependency.toSrgFile

// Creates a task named 'renameJar'
renamer.classes(tasks.named('jar', Jar)) {
    // Unless set globally like above, You need to point to the mappings you wish to apply, typically this is
    // the Mapped names to SRG for older versions.
    // ForgeGradle/Mavenizer generate these files for the dependencies you declare. So you can use the helper.
    // Or you can specify the file or dependency if you host them yourself.
    map.from minecraft.dependency.toSrgFile
    // This is publishable task so you can specify things such as the classifier
    archiveClassifier = ''
}

// If you want to create another task, or customize the name you can specify it as the first argument
renamer.classes('renameJarToSrg', tasks.named('jar', Jar)) {
    // This specifies the map via a dependency coordinate, such as 'net.minecraft:mappings_official:1.20.1-20230612.114412:map2srg@tsrg.gz'
    mappings(minecraft.dependency.toSrg.get())
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    repositories {
        maven { url = project.layout.projectDirectory.dir('mcmodsrepo').asFile.toURL() }
    }

    publications.register('mavenJava', MavenPublication) {
        from components.java // Publish the normal jar
        artifact renameJar // Publish the renamed jar in addition
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

eclipse {
    // Eclipse no longer downloads javadocs and sources by default, this tells Gradle to force Eclipse to do it.
    classpath {
        downloadJavadoc = downloadSources = true
    }

    // Refresh ForgeGradle launch configurations when Buildship imports/synchronizes the project.
    synchronizationTasks 'genEclipseRuns'

    // Uncomment to regenerate launch configurations every time Eclipse builds the code.
    //autoBuildTasks genEclipseRuns
}

// NOTE: Merging of source sets is now controlled by the property 'net.minecraftforge.gradle.merge-source-sets'
