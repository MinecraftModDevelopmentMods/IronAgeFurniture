minecraft {
    mappings channel: project.mcp_mappings_channel, version: project.mcp_mappings_version

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir(
                    providers.gradleProperty('runDirectory').getOrElse('run'))
            jvmArgs '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            mods {
                ironagefurniture { source sourceSets.main }
            }
        }
        register('client') { workingDir.set(coreRunDirectory) }
        register('clientCompatibility') {
            workingDir.set(compatibilityRunDirectory)
            // Both clients need Forge 37's module-path bootstrap and native
            // libraries. Only their game folders and installed mods differ.
            mainClass.set('cpw.mods.bootstraplauncher.BootstrapLauncher')
            args '--launchTarget', 'forgeclientuserdev', '--version', 'MOD_DEV',
                    '--assetIndex', '{asset_index}', '--assetsDir', '{assets_root}', '--gameDir', '.',
                    '--fml.forgeVersion', forge_version, '--fml.mcVersion', minecraft_version,
                    '--fml.forgeGroup', 'net.minecraftforge', '--fml.mcpVersion', mcp_version
            jvmArgs '-p', '{modules}', '--add-modules', 'ALL-MODULE-PATH',
                    '--add-opens', 'java.base/java.util.jar=cpw.mods.securejarhandler',
                    '--add-exports', 'java.base/sun.security.util=cpw.mods.securejarhandler',
                    '--add-exports', 'jdk.naming.dns/com.sun.jndi.dns=java.naming'
            systemProperty 'legacyClassPath.file', '{minecraft_classpath_file}'
            systemProperty 'ignoreList', 'bootstraplauncher,securejarhandler,asm-commons,asm-util,asm-analysis,asm-tree,asm,client-extra,fmlcore,javafmllanguage,mclanguage,forge-'
            systemProperty 'nativesDirectory', '{natives}'
            systemProperty 'mergeModules', 'jna-5.8.0.jar,jna-platform-58.0.jar,java-objc-bridge-1.0.0.jar'
            client.set(true)
        }
        register('server') {
            args '--nogui'
        }
        register('data') {
            workingDir.convention layout.projectDirectory.dir('run-data')
            args '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

