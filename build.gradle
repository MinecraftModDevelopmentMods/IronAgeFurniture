tasks.register('verifyMavenCoordinates') {
    group = 'verification'
    description = 'Verifies the generated POM and manifest publication namespace.'
    dependsOn tasks.named('generatePomFileForMavenJavaPublication')
    doLast {
        File pomFile = layout.buildDirectory.file('publications/mavenJava/pom-default.xml').get().asFile
        def pom = new XmlSlurper(false, false).parse(pomFile)
        def actual = [pom.groupId.text(), pom.artifactId.text(), pom.version.text()]
        def expected = [expectedMavenGroup, expectedMavenArtifact, project.version.toString()]
        if (project.group.toString() != expectedMavenGroup || actual != expected) {
            throw new GradleException("Expected Maven coordinate ${expected.join(':')}, found ${actual.join(':')}")
        }
    }
}

tasks.register('verifyMavenizerCompatibilityFixture') {
    group = 'verification'
    description = 'Verifies the sealed target-aware ForgeGradle Mavenizer compatibility tool.'
    inputs.files mavenizerFixtureChecksums.keySet()
    doLast {
        mavenizerFixtureChecksums.each { fixture, expected ->
            if (!fixture.isFile() || sha256Of(fixture) != expected) {
                throw new GradleException("Mavenizer fixture is missing or changed: ${fixture}")
            }
        }
        def parsed = new JsonSlurper().parse(mavenizerRuleManifest.asFile)
        if (parsed.schema != 1 || parsed.targets.keySet() !=
                ['net.minecraftforge:forge:1.20.1-47.4.10'] as Set) {
            throw new GradleException('Mavenizer target-rule manifest has unexpected targets or schema')
        }
        def rules = parsed.targets['net.minecraftforge:forge:1.20.1-47.4.10']
        if (rules.expectedApplications != 8 || rules.rules.size() != 8
                || rules.rules.collect { it.id }.toSet().size() != 8) {
            throw new GradleException('Mavenizer target-rule manifest must define eight unique Forge 47 rules')
        }
        new ZipFile(mavenizerCompatibilityJar.asFile).withCloseable { ZipFile zip ->
            def embeddedEntry = zip.getEntry('META-INF/orespawn/minecraft-source-compatibility.json')
            if (embeddedEntry == null) {
                throw new GradleException('Mavenizer fixture is missing its embedded target-rule manifest')
            }
            byte[] embedded = zip.getInputStream(embeddedEntry).withCloseable { it.readAllBytes() }
            if (!Arrays.equals(embedded, mavenizerRuleManifest.asFile.bytes)) {
                throw new GradleException('Embedded and externally audited Mavenizer manifests differ')
            }
            def patcherEntry = zip.getEntry(
                    'net/minecraftforge/mcmaven/impl/util/SourceCompatibilityPatcher.class')
            byte[] classHeader = zip.getInputStream(patcherEntry).withCloseable { it.readNBytes(8) }
            int classMajor = ((classHeader[6] & 0xff) << 8) | (classHeader[7] & 0xff)
            if (classMajor != 69) {
                throw new GradleException("Mavenizer compatibility tool must use Java 25 bytecode, found ${classMajor}")
            }
            Manifest fixtureManifest = new Manifest(
                    zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')))
            if (fixtureManifest.mainAttributes.getValue('Main-Class') !=
                    'net.minecraftforge.mcmaven.cli.Main') {
                throw new GradleException('Mavenizer compatibility fixture has an unexpected main class')
            }
        }
        if (!mavenizerReadme.asFile.getText('UTF-8').contains('Temurin `25.0.3+9`')
                || !mavenizerSourcePatch.asFile.getText('UTF-8').contains('SourceCompatibilityPatcher.java')
                || !mavenizerLicense.asFile.getText('UTF-8').contains('GNU LESSER GENERAL PUBLIC LICENSE')) {
            throw new GradleException('Mavenizer provenance, patch, or license documentation is incomplete')
        }
    }
}

