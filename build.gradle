import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.nio.charset.StandardCharsets
import org.apache.tools.ant.filters.FixCrLfFilter
import org.gradle.jvm.toolchain.JvmVendorSpec
import org.gradle.plugins.ide.eclipse.model.Container

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

group = project.mod_group
version = project.mod_version
base.archivesName = project.mod_archive_name

def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}

def minecraftVersionParts = project.minecraft_version.toString().tokenize('.')
if (minecraftVersionParts.size() < 2 || minecraftVersionParts.size() > 3
        || !minecraftVersionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("minecraft_version must use major.minor or major.minor.patch numeric form: ${project.minecraft_version}")
}
def minecraftPatch = minecraftVersionParts.size() == 3 ? minecraftVersionParts[2] : '0'
def expectedTargetVersion = "${minecraftVersionParts[0]}" \
        + "${minecraftVersionParts[1].padLeft(2, '0')}" \
        + "${minecraftPatch.padLeft(2, '0')}" \
        + project.loader_code
if (versionParts[3] != expectedTargetVersion) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match "
            + "Minecraft ${project.minecraft_version} ${project.loader_name} target ${expectedTargetVersion}")
}

ext.functional_version = versionParts[0..2].join('.')
ext.display_version = project.mod_version
ext.release_tag = project.mod_version

if (GradleVersion.current() != GradleVersion.version('9.6.1')) {
    throw new GradleException("This build requires Gradle 9.6.1, found ${GradleVersion.current()}")
}
if (JavaVersion.current() != JavaVersion.VERSION_17) {
    throw new GradleException("Gradle must run on Java 17, found ${System.getProperty('java.version')}")
}

def java8Compiler = javaToolchains.compilerFor {
    languageVersion = JavaLanguageVersion.of(project.java_version as int)
    vendor = JvmVendorSpec.ADOPTIUM
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
    toolchain.vendor = JvmVendorSpec.ADOPTIUM
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = java8Compiler

    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000', '-proc:none'])
}

tasks.register('verifyBuildEnvironment') {
    group = 'verification'
    description = 'Verifies the pinned Gradle runtime and exact Java 8 compiler toolchain.'
    doLast {
        String configured = project.java_toolchain_version.toString()
        def expected = configured =~ /^8\.0\.(\d+)\+(\d+)$/
        if (!expected.matches()) {
            throw new GradleException("java_toolchain_version must use 8.0.update+build form: ${configured}")
        }
        def metadata = java8Compiler.get().metadata
        def actual = metadata.javaRuntimeVersion.toString() =~ /^1\.8\.0_(\d+)-b0*(\d+)$/
        if (!actual.matches()
                || actual.group(1) != expected.group(1)
                || actual.group(2) != expected.group(2)) {
            throw new GradleException("Java compiler toolchain must be ${configured}; found "
                    + "${metadata.vendor} ${metadata.javaRuntimeVersion} at ${metadata.installationPath}")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('verifyBuildEnvironment')
}

tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def archiveTextSuffixes = [
        '.cfg', '.css', '.html', '.info', '.java', '.js', '.json', '.lang',
        '.mcmeta', '.md', '.properties', '.txt', '.xml'
]
def archiveTextPatterns = archiveTextSuffixes.collect { "**/*${it}".toString() }
archiveTextPatterns.addAll(['**/element-list', '**/package-list'])
def normalizeArchiveLineEndings = { details ->
    details.filter(FixCrLfFilter,
            eol: FixCrLfFilter.CrLf.newInstance('lf'),
            eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.console.level', 'info'
        }
        register('client')
        register('server') {
            args '--nogui'
        }
    }
}

// Forge 1.10 expects classes and resources for a development mod to share one
// classpath root. ForgeGradle 7 separates them, so merge only the launch output.
def forge10DevelopmentOutput = layout.buildDirectory.dir('forge10-development/main')
def syncForge10DevelopmentResources = tasks.register('syncForge10DevelopmentResources', Sync) {
    group = 'ide'
    description = 'Merges processed resources into the Forge 1.10 development launch root.'
    dependsOn tasks.named('classes')
    from tasks.named('compileJava', JavaCompile).flatMap { it.destinationDirectory }
    from sourceSets.main.output.resourcesDir
    into forge10DevelopmentOutput
}
tasks.configureEach {
    if (name == 'runClient' || name == 'runServer') {
        dependsOn syncForge10DevelopmentResources
        doFirst {
            Set<File> splitMainOutputs = [
                    tasks.named('compileJava', JavaCompile).get().destinationDirectory.get().asFile,
                    sourceSets.main.output.resourcesDir
            ] as Set<File>
            classpath = files(forge10DevelopmentOutput, classpath.filter {
                !splitMainOutputs.contains(it)
            })
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net/'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com/'
            }
        }
        filter { includeGroup('mezz.jei') }
    }
}

dependencies {
    implementation minecraft.dependency(
            "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    compileOnly "mezz.jei:jei_1.10.2:${project.jei_version}:api"
    compileOnly 'org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209'
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.property('version', project.version)
    inputs.property('mcversion', project.minecraft_version)

    filesMatching('mcmod.info') {
        expand version: project.version, mcversion: project.minecraft_version
    }
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)

    doLast {
        def parseJsonFile = { File jsonFile ->
            String jsonText = jsonFile.getText('UTF-8')
            if (jsonText.startsWith('\uFEFF')) {
                jsonText = jsonText.substring(1)
            }
            new JsonSlurper().parseText(jsonText)
        }
        File resourceOutput = destinationDir
        File assetRoot = new File(resourceOutput, 'assets/ironagefurniture')
        File blockstateDir = new File(assetRoot, 'blockstates')
        File itemModelDir = new File(assetRoot, 'models/item')
        String blockModelPrefix = 'ironagefurniture:block/'
        Set<String> collapsibleItemModelKeys = ['credit', 'parent'] as Set
        int collapsedItemModels = 0
        long collapsedItemModelBytes = 0

        if (blockstateDir.exists() && itemModelDir.exists()) {
            fileTree(dir: itemModelDir, include: '**/*.json').each { File itemModelFile ->
                File blockstateFile = new File(blockstateDir, itemModelFile.name)
                if (blockstateFile.exists()) {
                    def itemModel = parseJsonFile(itemModelFile)
                    if (itemModel instanceof Map) {
                        def parent = itemModel.parent
                        if (parent instanceof String && parent.startsWith(blockModelPrefix)
                                && (itemModel.keySet() as Set).every {
                                    collapsibleItemModelKeys.contains(it)
                                }) {
                            def blockstate = parseJsonFile(blockstateFile)
                            if (blockstate instanceof Map && blockstate.variants instanceof Map
                                    && !blockstate.variants.containsKey('inventory')) {
                                blockstate.variants.inventory = [
                                        model: 'ironagefurniture:'
                                                + parent.substring(blockModelPrefix.length())
                                ]
                                blockstateFile.setText(JsonOutput.toJson(blockstate), 'UTF-8')
                                collapsedItemModelBytes += itemModelFile.length()
                                if (itemModelFile.delete()) {
                                    collapsedItemModels++
                                }
                            }
                        }
                    }
                }
            }
        }
        logger.lifecycle('Collapsed {} item wrapper models into blockstate inventory variants; removed {} raw bytes.',
                collapsedItemModels, collapsedItemModelBytes)

        int jsonMinified = 0
        long jsonBytesSaved = 0
        fileTree(dir: resourceOutput, include: '**/*.json').each { File jsonFile ->
            long oldLength = jsonFile.length()
            jsonFile.setText(JsonOutput.toJson(parseJsonFile(jsonFile)), 'UTF-8')
            jsonMinified++
            jsonBytesSaved += oldLength - jsonFile.length()
        }
        logger.lifecycle('Minified {} JSON files; saved {} bytes.', jsonMinified, jsonBytesSaved)
    }
}

def commonManifest = {
    attributes([
            'Specification-Title'       : project.mod_name,
            'Specification-Vendor'      : project.mod_authors,
            'Specification-Version'     : versionParts[0],
            'Implementation-Title'      : base.archivesName.get(),
            'Implementation-Version'    : project.version,
            'Implementation-Vendor'     : project.mod_authors,
            'Maven-Artifact'             : "${project.group}:${base.archivesName.get()}:${project.version}",
            'Built-On-Java'              : project.java_version,
            'Built-On'                   : "${project.minecraft_version}-${project.forge_version}"
    ])
}

tasks.named('jar', Jar) {
    archiveClassifier = 'deobf'
    destinationDirectory = layout.buildDirectory.dir('libs-dev')
    manifest(commonManifest)
}

def releaseJar = renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = null
    output = layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}.jar")
}

tasks.named('sourcesJar', Jar) {
    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
    archiveClassifier = 'sources'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}:sources",
                'Implementation-Title'  : "${project.mod_name}-sources",
                'Implementation-Version': project.version
        ])
    }
}

tasks.named('javadocJar', Jar) {
    filteringCharset = 'UTF-8'
    archiveClassifier = 'javadoc'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}:javadoc",
                'Implementation-Title'  : "${project.mod_name}-javadoc",
                'Implementation-Version': project.version
        ])
    }
}

['apiElements', 'runtimeElements'].each { configurationName ->
    configurations.named(configurationName) {
        artifacts.clear()
    }
    artifacts {
        add(configurationName, releaseJar)
    }
}

tasks.named('assemble') {
    dependsOn releaseJar
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('javadocJar')
}

def obsoleteForgeGradle2EclipseLaunches = [
        'IronAgeFurniture_Client.launch': 'GradleStart',
        'IronAgeFurniture_Server.launch': 'GradleStartServer'
]

eclipse {
    project {
        buildCommand 'org.eclipse.buildship.core.gradleprojectbuilder'
        natures 'org.eclipse.buildship.core.gradleprojectnature'
    }
    classpath {
        downloadSources = true
        downloadJavadoc = true
        file.whenMerged { classpath ->
            classpath.entries.removeAll { it.kind == 'lib' }
            if (!classpath.entries.any {
                    it.kind == 'con' && it.path == 'org.eclipse.buildship.core.gradleclasspathcontainer'
            }) {
                classpath.entries.add(new Container('org.eclipse.buildship.core.gradleclasspathcontainer'))
            }
        }
    }
    synchronizationTasks 'isolateEclipseProductionRuns'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('configureEclipseBuildship') {
    group = 'ide'
    description = 'Creates Buildship wrapper and project-cache preferences.'
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        [
                'eclipse.preferences.version'     : '1',
                'connection.gradle.distribution' : 'GRADLE_DISTRIBUTION(WRAPPER)',
                'connection.gradle.user.home'    : gradle.gradleUserHomeDir.canonicalPath,
                'connection.project.dir'         : '',
                'gradle.user.home'                : gradle.gradleUserHomeDir.canonicalPath,
                'override.workspace.settings'    : 'true'
        ].each { key, value -> preferences.setProperty(key, value) }
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream {
            preferences.store(it, 'Generated by configureEclipseBuildship.')
        }
    }
}

tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    description = 'Generates FG7 Eclipse runs, removes exact FG2 launches, and excludes tests.'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn tasks.named('configureEclipseBuildship')

    doLast {
        obsoleteForgeGradle2EclipseLaunches.each { String name, String mainClass ->
            File launch = file(name)
            if (launch.isFile()) {
                String contents = launch.getText('UTF-8')
                String obsoleteMainType =
                        "org.eclipse.jdt.launching.MAIN_TYPE\" value=\"${mainClass}\""
                if (contents.contains(obsoleteMainType) && !launch.delete()) {
                    throw new GradleException("Could not remove obsolete ForgeGradle 2 launch ${name}")
                }
            }
        }

        List<File> runLaunches = [
                file('runClient.launch'), file('runServer.launch'),
                file('.eclipse/runClient.launch'), file('.eclipse/runServer.launch')
        ].findAll { it.isFile() }
        if (runLaunches.size() < 2) {
            throw new GradleException('ForgeGradle did not generate ordinary client/server Eclipse launches')
        }
        runLaunches.each { File launch ->
            String contents = launch.getText('UTF-8')
            if (!contents.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                String marker = '</launchConfiguration>'
                String attribute =
                        '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>'
                contents = contents.replace(marker, attribute + '\n' + marker)
            }
            launch.setText(contents.replace('\r\n', '\n'), 'UTF-8')
        }
    }
}

tasks.register('prepareEclipse') {
    group = 'ide'
    description = 'Creates the Buildship project model and ForgeGradle 7 launch profiles.'
    dependsOn tasks.named('eclipse')
    dependsOn tasks.named('isolateEclipseProductionRuns')
}

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    description = 'Verifies Buildship classpath use and production-only FG7 launches.'
    dependsOn tasks.named('prepareEclipse')

    doLast {
        File classpathFile = file('.classpath')
        String classpathText = classpathFile.getText('UTF-8')
        if (!classpathText.contains('org.eclipse.buildship.core.gradleclasspathcontainer')) {
            throw new GradleException('Eclipse classpath does not use the Buildship Gradle container')
        }
        if (classpathText.contains('<classpathentry kind="lib"')
                || classpathText ==~ /(?s).*<classpathentry[^>]+path="[A-Za-z]:[\\\/].*/) {
            throw new GradleException('Eclipse classpath contains an absolute library entry')
        }
        obsoleteForgeGradle2EclipseLaunches.each { String name, String mainClass ->
            File launch = file(name)
            if (launch.isFile() && launch.getText('UTF-8').contains(
                    "org.eclipse.jdt.launching.MAIN_TYPE\" value=\"${mainClass}\"")) {
                throw new GradleException("Obsolete ForgeGradle 2 launch remains at ${name}")
            }
        }
        List<File> launchFiles = [
                file('runClient.launch'), file('runServer.launch'),
                file('.eclipse/runClient.launch'), file('.eclipse/runServer.launch')
        ].findAll { it.isFile() }
        if (launchFiles.size() < 2 || launchFiles.any {
                String text = it.getText('UTF-8')
                !text.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')
                        || !text.contains('value="true"')
        }) {
            throw new GradleException('Generated Eclipse launches do not consistently exclude test code')
        }
    }
}
