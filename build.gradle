tasks.register('runCorePackagedServer', Exec) {
    group = 'verification'
    description = 'Runs the packaged Forge server without optional mods and proves conditioned data is absent.'
    dependsOn tasks.named('stageCoreAbsenceFixture')
    dependsOn tasks.named('prepareOptionalIntegrationServer')
    doFirst {
        File serverDirectory = optionalIntegrationServerDirectory.get()
        File marker = new File(serverDirectory, 'optional-integration-pass.properties')
        if (marker.exists() && !marker.delete()) {
            throw new GradleException("Could not remove stale core-smoke marker ${marker}")
        }
        new File(serverDirectory, 'server.properties').setText([
                'allow-flight=true', 'level-name=core-absence-world',
                'max-tick-time=120000', 'online-mode=false',
                'server-ip=127.0.0.1', 'server-port=0', ''
        ].join('\n'), 'UTF-8')
        File forgeServerJar = optionalIntegrationForgeServerJar.get()
        workingDir serverDirectory
        executable java8Launcher.get().executablePath.asFile
        args '-Diaf.probe.profile=absent', '-Dfml.queryResult=confirm',
                '-jar', forgeServerJar.name, 'nogui'
    }
    doLast {
        File marker = new File(optionalIntegrationServerDirectory.get(),
                'optional-integration-pass.properties')
        if (!marker.isFile()) {
            throw new GradleException('Core packaged server exited without a passing probe marker')
        }
        Properties result = new Properties()
        marker.withInputStream { result.load(it) }
        if (result.getProperty('status') != 'PASS'
                || result.getProperty('profile') != 'absent'
                || result.getProperty('conditional_recipes_loaded') != '0'
                || result.getProperty('conditional_advancements_loaded') != '0') {
            throw new GradleException("Unexpected core packaged-server result ${result}")
        }
    }
}

tasks.register('verifyResourceJson') {
    group = 'verification'
    description = 'Validates legacy 1.12 JSON, locale parity, exact recipe unlocks, and optional conditions.'
    dependsOn tasks.named('verifyFurnitureCatalog')
    doLast {
        List<File> jsonFiles = fileTree('src/main/resources') {
            include '**/*.json'
            include 'pack.mcmeta'
        }.files.sort { it.path }
        jsonFiles.each { candidate ->
            try {
                new JsonSlurper().parseText(candidate.getText('UTF-8').replaceFirst(/^\uFEFF/, ''))
            } catch (Exception ex) {
                throw new GradleException("Invalid resource JSON: ${candidate}", ex)
            }
        }

        def localeKeys = { File locale ->
            locale.readLines('UTF-8').findAll { line ->
                String trimmed = line.trim()
                !trimmed.isEmpty() && !trimmed.startsWith('#')
            }.collect { line -> line.substring(0, line.indexOf('=')) }
        }
        List<File> locales = ['en_EN.lang', 'en_GB.lang', 'en_US.lang'].collect {
            file("src/main/resources/assets/ironagefurniture/lang/${it}")
        }
        List<String> englishKeys = localeKeys(locales.first())
        locales.tail().each { locale ->
            if (localeKeys(locale) != englishKeys) {
                throw new GradleException("${locale.name} does not match en_EN.lang ordered keys")
            }
        }

        File recipeRoot = file('src/main/resources/assets/ironagefurniture/recipes')
        File advancementRoot = file('src/main/resources/assets/ironagefurniture/advancements/recipes')
        List<File> recipes = fileTree(recipeRoot) { include '*.json' }.files.sort { it.name }
        List<File> advancements = fileTree(advancementRoot) { include '*.json' }.files.sort { it.name }
        if (recipes.collect { it.name } != advancements.collect { it.name }) {
            throw new GradleException('Recipe and advancement inventories differ')
        }
        Map<String, Map> recipeByName = recipes.collectEntries {
            [(it.name): new JsonSlurper().parse(it) as Map]
        }
        advancements.each { advancementFile ->
            Map advancement = new JsonSlurper().parse(advancementFile) as Map
            String id = advancementFile.name.replaceFirst(/\.json$/, '')
            Map criteria = advancement.criteria as Map
            Map ingredient = criteria?.has_ingredient as Map
            Map unlocked = criteria?.has_the_recipe as Map
            if (!(ingredient?.conditions?.items instanceof List)
                    || ingredient.conditions.items.size() != 1
                    || !(ingredient.conditions.items[0].item instanceof String)
                    || unlocked?.conditions?.recipe != "ironagefurniture:${id}"
                    || advancement.rewards?.recipes != ["ironagefurniture:${id}"]
                    || advancement.requirements != [['has_ingredient', 'has_the_recipe']]) {
                throw new GradleException("Invalid exact recipe advancement ${advancementFile}")
            }
            Map recipe = recipeByName[advancementFile.name]
            String optionalMod = advancement.conditions instanceof List
                    ? advancement.conditions.find { it.type == 'forge:mod_loaded' }?.modid : null
            String recipeOptionalMod = recipe.conditions instanceof List
                    ? recipe.conditions.find { it.type == 'forge:mod_loaded' }?.modid : null
            if (optionalMod != recipeOptionalMod) {
                throw new GradleException("Recipe/advancement condition mismatch for ${id}")
            }
        }
        logger.lifecycle('Validated {} JSON documents, {} locale keys, and {} exact recipe advancements.',
                jsonFiles.size(), englishKeys.size(), advancements.size())
    }
}

tasks.register('verifyNamespace') {
    group = 'verification'
    description = 'Requires the maintained Java namespace while preserving the runtime mod namespace.'
    doLast {
        String legacyPackage = 'com.mcmoddev.ironagefurniture'
        String maintainedPackage = 'zone.moddev.mc.ironagefurniture'
        String maintainedPath = "src/main/java/${maintainedPackage.replace('.', '/')}/"
        List<File> sources = fileTree('src/main/java') { include '**/*.java' }.files.sort { it.path }
        if (sources.size() < 42) {
            throw new GradleException("Expected at least 42 production Java sources, found ${sources.size()}")
        }
        sources.each { sourceFile ->
            String relativePath = project.relativePath(sourceFile).replace('\\', '/')
            String contents = sourceFile.getText('UTF-8').replaceFirst(/^\uFEFF/, '')
            if (!relativePath.startsWith(maintainedPath) || contents.contains(legacyPackage)) {
                throw new GradleException("Legacy or misplaced IronAgeFurniture source: ${relativePath}")
            }
            def packageMatch = contents =~ /(?m)^package\s+([^;]+);/
            if (!packageMatch.find()) {
                throw new GradleException("Java source has no package declaration: ${relativePath}")
            }
            String expectedPackage = relativePath.substring('src/main/java/'.length(),
                    relativePath.lastIndexOf('/')).replace('/', '.')
            if (packageMatch.group(1) != expectedPackage) {
                throw new GradleException("Package/path mismatch in ${relativePath}: ${packageMatch.group(1)}")
            }
        }
        ['assets/ironagefurniture'].each { path ->
            if (!file("src/main/resources/${path}").isDirectory()) {
                throw new GradleException("Persistent resource namespace is missing: ${path}")
            }
        }
    }
}

tasks.register('verifyVersionMetadata') {
    group = 'verification'
    description = 'Checks authoritative version and generated Forge metadata.'
    dependsOn tasks.named('processResources')
    doLast {
        String source = file(
                'src/main/java/zone/moddev/mc/ironagefurniture/Ironagefurniture.java').getText('UTF-8')
        if (!source.contains("VERSION = \"${project.version}\"")) {
            throw new GradleException('Java VERSION constant is not synchronized')
        }
        ['README.md', 'CHANGELOG.md', 'docs/VERSIONS.md'].each { path ->
            if (!file(path).getText('UTF-8').contains(project.version.toString())) {
                throw new GradleException("Version is missing from ${path}")
            }
        }
        File generated = layout.buildDirectory.file('resources/main/mcmod.info').get().asFile
        String metadata = generated.getText('UTF-8')
        [
                '"modid": "ironagefurniture"',
                "\"version\": \"${project.version}\"",
                '"license": "LGPL-2.1"',
                "\"mcversion\": \"${project.minecraft_version}\""
        ].each { required ->
            if (!metadata.contains(required)) {
                throw new GradleException("Generated mcmod.info is missing ${required}")
            }
        }
        if (metadata.contains('${')) {
            throw new GradleException('Generated mcmod.info contains unresolved properties')
        }
    }
}

tasks.register('verifyDedicatedServerBoundaries') {
    group = 'verification'
    description = 'Keeps common 1.12 code free of unguarded client-only references.'
    doLast {
        String entrypoint = file(
                'src/main/java/zone/moddev/mc/ironagefurniture/Ironagefurniture.java').getText('UTF-8')
        if (!entrypoint.contains('event.getSide().isClient()')
                || !entrypoint.contains('ItemInitialiser.RegisterItemRenders()')) {
            throw new GradleException('Client item rendering is not guarded by the FML client side')
        }
        fileTree('src/main/java') {
            include '**/*.java'
            exclude '**/init/ItemInitialiser.java'
            exclude '**/init/ClientModelInitialiser.java'
            exclude '**/init/ClientRenderInitialiser.java'
            exclude '**/client/**'
        }.each { source ->
            String text = source.getText('UTF-8')
            if (text.contains('net.minecraft.client.') || text.contains('net.minecraftforge.client.')) {
                throw new GradleException("Common production source has client-only import: ${source}")
            }
        }
    }
}

tasks.register('verifyWorkflowPins') {
    group = 'verification'
    description = 'Requires third-party GitHub Actions to be pinned to full commit SHAs.'
    doLast {
        File workflows = file('.github/workflows')
        if (!workflows.isDirectory()) {
            throw new GradleException('Missing GitHub Actions workflows')
        }
        fileTree(workflows) { include '*.yml'; include '*.yaml' }.each { workflow ->
            workflow.readLines('UTF-8').eachWithIndex { line, index ->
                def match = line =~ /^\s*uses:\s*([^#\s]+).*/
                if (match.matches()) {
                    String action = match.group(1)
                    if (!action.startsWith('./') && !(action ==~ /[^@]+@[0-9a-f]{40}/)) {
                        throw new GradleException("Unpinned action ${action} at ${workflow}:${index + 1}")
                    }
                }
            }
        }
    }
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    description = 'Audits exactly three deterministic Java 8 release jars.'
    dependsOn tasks.named('assemble')
    dependsOn tasks.named('verifyReleaseConfiguration')
    dependsOn tasks.named('verifyRepositoryHygiene')
    dependsOn tasks.named('verifyResourceJson')
    dependsOn tasks.named('verifyNamespace')
    dependsOn tasks.named('verifyVersionMetadata')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        List<File> jars = (libs.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }.sort { it.name }
        List<String> expected = expectedReleaseFiles.get().sort()
        if (jars.collect { it.name } != expected || jars.any { it.length() == 0L }) {
            throw new GradleException("Expected exactly three non-empty release jars ${expected}, " +
                    "found ${jars.collect { it.name }}")
        }
        List<String> forbiddenEntries = [
                'com/mcmoddev/ironagefurniture/', 'src/test/', 'src/optionalIntegrationTest/',
                'zone/moddev/mc/ironagefurniture/fixture/',
                'ironagefurniture-optional-integration-probe', 'agent-notes/', '.github/',
                '.classpath', '.project', 'ci-fixtures/', 'minecraft-mavenizer', 'build/', 'run/'
        ]
        jars.each { candidate ->
            new ZipFile(candidate).withCloseable { ZipFile zip ->
                List<String> names = zip.entries().collect { it.name }
                forbiddenEntries.each { forbidden ->
                    if (names.any { it.contains(forbidden) }) {
                        throw new GradleException("${candidate.name} contains forbidden entry ${forbidden}")
                    }
                }
                zip.entries().findAll { entry ->
                    !entry.isDirectory() && (archiveTextSuffixes.any { entry.name.endsWith(it) }
                            || entry.name.endsWith('/element-list')
                            || entry.name.endsWith('/package-list'))
                }.each { entry ->
                    if (zip.getInputStream(entry).withCloseable { it.bytes.any { value -> value == 13 } }) {
                        throw new GradleException("${candidate.name}!/${entry.name} does not use LF endings")
                    }
                }
            }
        }
        File mainJar = new File(libs, expectedReleaseFiles.get()[0])
        new ZipFile(mainJar).withCloseable { ZipFile zip ->
            [
                    'mcmod.info',
                    'assets/ironagefurniture/lang/en_US.lang',
                    'zone/moddev/mc/ironagefurniture/Ironagefurniture.class'
            ].each { required ->
                if (zip.getEntry(required) == null) {
                    throw new GradleException("Release jar is missing ${required}")
                }
            }
            String metadata = zip.getInputStream(zip.getEntry('mcmod.info'))
                    .withCloseable { it.getText('UTF-8') }
            if (!metadata.contains('"modid": "ironagefurniture"')
                    || !metadata.contains("\"version\": \"${project.version}\"")
                    || metadata.contains('${')) {
                throw new GradleException('Packaged mcmod.info is not synchronized')
            }
            Manifest manifest = new Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')))
            if (manifest.mainAttributes.getValue('Implementation-Version') != project.version.toString()
                    || manifest.mainAttributes.getValue('Maven-Artifact') != expectedMavenCoordinate
                    || manifest.mainAttributes.getValue('Implementation-Timestamp') != null
                    || manifest.mainAttributes.getValue('Timestamp') != null) {
                throw new GradleException('Release manifest identity is incorrect or volatile')
            }
            zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                byte[] header = zip.getInputStream(entry).withCloseable { it.readNBytes(8) }
                int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                if (major != 52) {
                    throw new GradleException("${entry.name} uses class major ${major}, expected 52")
                }
            }
            if (zip.entries().any { it.name.endsWith('.java')
                    || it.name.startsWith('assets/iron-age-furniture/')
                    || it.name.startsWith('data/iron-age-furniture/') }) {
                throw new GradleException('Runtime jar contains source or a renamed persistent namespace')
            }
        }
        new ZipFile(new File(libs, expectedReleaseFiles.get()[1])).withCloseable { zip ->
            if (zip.getEntry('zone/moddev/mc/ironagefurniture/Ironagefurniture.java') == null) {
                throw new GradleException('Sources jar is missing Ironagefurniture.java')
            }
        }
        new ZipFile(new File(libs, expectedReleaseFiles.get()[2])).withCloseable { zip ->
            if (zip.getEntry('index.html') == null) {
                throw new GradleException('Javadoc jar is missing index.html')
            }
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    description = 'Writes SHA-256 checksums for the audited release jars.'
    dependsOn tasks.named('verifyReleaseArtifacts')
    outputs.file(layout.buildDirectory.file('release/SHA256SUMS'))
    doLast {
        File output = layout.buildDirectory.file('release/SHA256SUMS').get().asFile
        output.parentFile.mkdirs()
        File libs = layout.buildDirectory.dir('libs').get().asFile
        output.setText(expectedReleaseFiles.get().sort().collect { name ->
            "${sha256Of(new File(libs, name))}  ${name}"
        }.join('\n') + '\n', 'UTF-8')
    }
}

tasks.register('verifyReleaseChecksums') {
    group = 'verification'
    description = 'Recomputes and verifies the release SHA-256 checksum manifest.'
    dependsOn tasks.named('writeReleaseChecksums')
    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        File manifest = layout.buildDirectory.file('release/SHA256SUMS').get().asFile
        Map<String, String> declared = manifest.readLines('UTF-8').findAll { !it.trim().isEmpty() }
                .collectEntries { line ->
                    def parts = line.split(/\s+/, 2)
                    [(parts[1]): parts[0].toUpperCase()]
                }
        if (declared.keySet().sort() != expectedReleaseFiles.get().sort()) {
            throw new GradleException('Checksum manifest does not list exactly the release artifacts')
        }
        declared.each { name, expected ->
            String actual = sha256Of(new File(libs, name))
            if (actual != expected) throw new GradleException("Checksum mismatch for ${name}")
        }
    }
}

tasks.register('prepareReleaseBundle', Sync) {
    group = 'verification'
    description = 'Copies the audited jars, checksum manifest, and release notes into one immutable bundle.'
    dependsOn tasks.named('verifyReleaseChecksums')
    into layout.buildDirectory.dir('prepared-release')
    from(layout.buildDirectory.dir('libs')) {
        include expectedReleaseFiles.get()
    }
    from(layout.buildDirectory.file('release/SHA256SUMS'))
    from('CHANGELOG.md')
}

tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    description = 'Audits a previously built immutable release bundle before publication.'
    doLast {
        if (!preparedReleaseDir.isPresent()) {
            throw new GradleException('preparedReleaseDir is required')
        }
        File prepared = file(preparedReleaseDir.get())
        List<String> expectedBundle = (expectedReleaseFiles.get()
                + ['SHA256SUMS', 'CHANGELOG.md']).sort()
        List<String> actualBundle = (prepared.listFiles() ?: [] as File[])
                .findAll { it.isFile() }.collect { it.name }.sort()
        if (actualBundle != expectedBundle) {
            throw new GradleException("Expected prepared bundle ${expectedBundle}, found ${actualBundle}")
        }
        Map<String, String> declared = new File(prepared, 'SHA256SUMS').readLines('UTF-8')
                .findAll { !it.trim().isEmpty() }.collectEntries { line ->
                    def parts = line.split(/\s+/, 2)
                    [(parts[1]): parts[0].toUpperCase()]
                }
        if (declared.keySet().sort() != expectedReleaseFiles.get().sort()) {
            throw new GradleException('Prepared checksums do not list exactly the release jars')
        }
        declared.each { name, expected ->
            if (sha256Of(new File(prepared, name)) != expected) {
                throw new GradleException("Prepared checksum mismatch for ${name}")
            }
        }
    }
}

tasks.register('validateMavenReleaseCredentials') {
    group = 'publishing'
    description = 'Prevents Maven publication without an explicit remote repository and credentials.'
    doLast {
        ['MAVEN_UPLOAD_URL', 'MAVEN_UPLOAD_USERNAME', 'MAVEN_UPLOAD_PASSWORD'].each { name ->
            if (!System.getenv(name)) throw new GradleException("${name} is required")
        }
        if (System.getenv('MAVEN_UPLOAD_URL').startsWith('file:')) {
            throw new GradleException('Maven release publication must use a remote repository')
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn tasks.named('validateMavenReleaseCredentials')
    dependsOn(preparedReleaseDir.isPresent()
            ? tasks.named('verifyPreparedReleaseArtifacts')
            : tasks.named('verifyReleaseArtifacts'))
}

tasks.register('syncForge28EclipseLaunches') {
    group = 'ide'
    description = 'Synchronizes processed resources and hardens Forge 28 Eclipse launches.'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn tasks.named('processResources')
    dependsOn tasks.named('verifyBuildEnvironment')
    doLast {
        String mainClass = 'net.minecraftforge.userdev.LaunchTesting'
        String mainOutput = new File(projectDir, 'bin/main').absolutePath
        String modClasses = "${project.mod_id}%%${mainOutput}${File.pathSeparator}" +
                "${project.mod_id}%%${mainOutput}"
        String eclipseGradleJavaHome = System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
        def escapePreference = { value -> value.replace('\\', '\\\\').replace(':', '\\:') }
        File buildshipPreferences = file('.settings/org.eclipse.buildship.core.prefs')
        buildshipPreferences.parentFile.mkdirs()
        buildshipPreferences.setText([
                'arguments=',
                'auto.sync=false',
                'build.scans.enabled=false',
                'connection.gradle.distribution=GRADLE_DISTRIBUTION(WRAPPER)',
                "connection.gradle.user.home=${escapePreference(gradle.gradleUserHomeDir.absolutePath)}",
                'connection.project.dir=',
                'eclipse.preferences.version=1',
                "gradle.user.home=${escapePreference(gradle.gradleUserHomeDir.absolutePath)}",
                "java.home=${escapePreference(eclipseGradleJavaHome)}",
                'jvm.arguments=',
                'offline.mode=false',
                'override.workspace.settings=true',
                'show.console.view=false',
                'show.executions.view=false',
                ''
        ].join('\r\n'), 'UTF-8')

        File processedResources = layout.buildDirectory.dir('resources/main').get().asFile
        copy {
            from processedResources
            into mainOutput
        }

        ['Client', 'Server', 'Data'].each { runName ->
            File launch = [file("run${runName}.launch"), file(".eclipse/run${runName}.launch")]
                    .find { it.isFile() }
            if (launch == null) {
                throw new GradleException("Missing generated Eclipse launch run${runName}.launch")
            }
            String text = launch.getText('UTF-8')
            if (text.contains('<mapAttribute key="org.eclipse.debug.core.environmentVariables"/>')) {
                text = text.replace(
                        '<mapAttribute key="org.eclipse.debug.core.environmentVariables"/>',
                        '<mapAttribute key="org.eclipse.debug.core.environmentVariables">\r\n' +
                        "    <mapEntry key=\"MOD_CLASSES\" value=\"${modClasses}\"/>\r\n" +
                        '</mapAttribute>')
            }
            text = text.replace('<stringAttribute key="org.eclipse.jdt.launching.MAIN_TYPE" value=""/>',
                    "<stringAttribute key=\"org.eclipse.jdt.launching.MAIN_TYPE\" value=\"${mainClass}\"/>")
            text = text.replaceFirst(
                    /<stringAttribute key="org.eclipse.jdt.launching.PROJECT_ATTR" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement(
                            "<stringAttribute key=\"org.eclipse.jdt.launching.PROJECT_ATTR\" value=\"${eclipseWorkspaceProjectName}\"/>"))
            text = text.replaceFirst(/<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement(
                            "<mapEntry key=\"MOD_CLASSES\" value=\"${modClasses}\"/>"))

            def programArguments = text =~ /(<stringAttribute key="org\.eclipse\.jdt\.launching\.PROGRAM_ARGUMENTS" value=")([^"]*)("\/>)/
            if (programArguments.count != 1) {
                throw new GradleException("ForgeGradle generated malformed program arguments in ${launch.name}")
            }
            String arguments = programArguments[0][2]
            ['cache', 'metadata', 'to-srg', 'to-obf'].each { flag ->
                String prefix = "--${flag} "
                int valueStart = arguments.indexOf(prefix)
                int valueEnd = valueStart < 0 ? -1 : arguments.indexOf(' --', valueStart + prefix.length())
                if (valueStart < 0 || valueEnd < 0) {
                    throw new GradleException("ForgeGradle omitted --${flag} from ${launch.name}")
                }
                valueStart += prefix.length()
                String value = arguments.substring(valueStart, valueEnd)
                if (!value.startsWith('&quot;') || !value.endsWith('&quot;')) {
                    arguments = "${arguments.substring(0, valueStart)}&quot;${value}&quot;${arguments.substring(valueEnd)}"
                }
            }
            text = text.replace(programArguments[0][0],
                    programArguments[0][1] + arguments + programArguments[0][3])

            if (!text.contains('ATTR_EXCLUDE_TEST_CODE')) {
                text = text.replace('</launchConfiguration>',
                        '    <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>\r\n' +
                        '</launchConfiguration>')
            }
            launch.setText(text, 'UTF-8')
        }
    }
}

tasks.register('syncForge12EclipseLaunches') {
    group = 'ide'
    description = 'Synchronizes processed resources and hardens Forge 1.12 Eclipse launches.'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn tasks.named('processResources')
    dependsOn tasks.named('verifyBuildEnvironment')
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        if (preferencesFile.isFile()) {
            preferencesFile.withInputStream { preferences.load(it) }
        }
        [
                'eclipse.preferences.version'    : '1',
                'connection.gradle.distribution': 'GRADLE_DISTRIBUTION(WRAPPER)',
                'connection.gradle.user.home'   : gradle.gradleUserHomeDir.canonicalPath,
                'connection.project.dir'        : '',
                'gradle.user.home'               : gradle.gradleUserHomeDir.canonicalPath,
                'override.workspace.settings'   : 'true'
        ].each { key, value -> preferences.setProperty(key, value) }
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream {
            preferences.store(it, 'Generated by syncForge12EclipseLaunches.')
        }

        File mainOutput = file('bin/main')
        copy {
            from layout.buildDirectory.dir('resources/main')
            into mainOutput
        }

        ['runClient.launch', 'runServer.launch'].each { name ->
            File launch = [file(name), file(".eclipse/${name}")].find { it.isFile() }
            if (launch == null) {
                throw new GradleException("ForgeGradle did not generate ${name}")
            }
            String contents = launch.getText('UTF-8')
            def programArguments = contents =~ /(<stringAttribute key="org\.eclipse\.jdt\.launching\.PROGRAM_ARGUMENTS" value=")([^"]*)("\/>)/
            if (programArguments.count != 1) {
                throw new GradleException("ForgeGradle generated malformed program arguments in ${name}")
            }
            String arguments = programArguments[0][2]
            ['cache', 'metadata', 'to-srg', 'to-obf'].each { flag ->
                String prefix = "--${flag} "
                int valueStart = arguments.indexOf(prefix)
                if (valueStart < 0) throw new GradleException("ForgeGradle omitted --${flag} from ${name}")
                valueStart += prefix.length()
                int valueEnd = arguments.indexOf(' --', valueStart)
                if (valueEnd < 0) throw new GradleException("ForgeGradle generated an unterminated --${flag} path")
                String value = arguments.substring(valueStart, valueEnd)
                if (!value.startsWith('&quot;') || !value.endsWith('&quot;')) {
                    arguments = "${arguments.substring(0, valueStart)}&quot;${value}&quot;${arguments.substring(valueEnd)}"
                }
            }
            contents = contents.replace(programArguments[0][0],
                    programArguments[0][1] + arguments + programArguments[0][3])
            if (!contents.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                contents = contents.replace('</launchConfiguration>',
                        '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>'
                        + System.lineSeparator() + '</launchConfiguration>')
            }
            contents = contents.replaceFirst(
                    /<stringAttribute key="org\.eclipse\.jdt\.launching\.PROJECT_ATTR" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement(
                            "<stringAttribute key=\"org.eclipse.jdt.launching.PROJECT_ATTR\" value=\"${eclipseWorkspaceProjectName}\"/>"))
            String eclipseModClasses = mainOutput.absolutePath
            if (contents.contains('key="MOD_CLASSES"')) {
                contents = contents.replaceAll(/<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                        java.util.regex.Matcher.quoteReplacement(
                                "<mapEntry key=\"MOD_CLASSES\" value=\"${eclipseModClasses}\"/>"))
            } else {
                contents = contents.replace('  </mapAttribute>',
                        "    <mapEntry key=\"MOD_CLASSES\" value=\"${eclipseModClasses}\"/>"
                        + System.lineSeparator() + '  </mapAttribute>')
            }
            launch.setText(contents, 'UTF-8')
        }
    }
}

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    description = 'Verifies Buildship and production-only Forge 1.12 launch metadata.'
    dependsOn tasks.named('eclipse')
    dependsOn tasks.named('syncForge12EclipseLaunches')
    doLast {
        File classpath = file('.classpath')
        File eclipseProject = file('.project')
        if (!classpath.isFile() || !eclipseProject.isFile()
                || !eclipseProject.getText('UTF-8').contains("<name>${eclipseWorkspaceProjectName}</name>")) {
            throw new GradleException('Eclipse project metadata is missing or misnamed')
        }
        def classpathXml = new XmlSlurper(false, false).parse(classpath)
        classpathXml.classpathentry.each { entry ->
            String path = entry.@path.text()
            boolean testSource = path.replace('\\', '/').startsWith('src/test/')
            boolean testLibrary = path ==~ /(?i).*\/(junit|hamcrest|mockito|byte-buddy)[^\/]*\/.*\.jar/
            if (testSource) {
                String scope = entry.attributes.attribute.find {
                    it.@name.text() == 'gradle_scope'
                }?.@value?.text()
                if (entry.@output.text() != 'bin/test' || scope != 'test') {
                    throw new GradleException("Eclipse test source is not isolated: ${path}")
                }
            }
            if (testLibrary) {
                String scope = entry.attributes.attribute.find {
                    it.@name.text() == 'gradle_used_by_scope'
                }?.@value?.text()
                if (scope != 'test') {
                    throw new GradleException("Eclipse production classpath exposes test dependency: ${path}")
                }
            }
        }
        File buildshipPreferences = file('.settings/org.eclipse.buildship.core.prefs')
        if (!buildshipPreferences.isFile()
                || !buildshipPreferences.getText('UTF-8').contains('override.workspace.settings=true')) {
            throw new GradleException('Eclipse Buildship wrapper preferences are missing')
        }
        ['Client', 'Server'].each { runName ->
            File launch = [file("run${runName}.launch"), file(".eclipse/run${runName}.launch")]
                    .find { it.isFile() }
            String text = launch.getText('UTF-8')
            String mainOutput = new File(projectDir, 'bin/main').absolutePath
            String expectedModClasses = mainOutput
            if (!text.contains('ATTR_EXCLUDE_TEST_CODE')
                    || text ==~ /(?s).*(?:junit|mockito|src[\\\/]test).*/
                    || !text.contains(expectedModClasses)
                    || !text.contains("key=\"org.eclipse.jdt.launching.PROJECT_ATTR\" value=\"${eclipseWorkspaceProjectName}\"")) {
                throw new GradleException("Eclipse launch is not production-only: ${launch.name}")
            }
            ['cache', 'metadata', 'to-srg', 'to-obf'].each { flag ->
                if (!text.contains("--${flag} &quot;")) {
                    throw new GradleException("Eclipse launch does not quote --${flag}: ${launch.name}")
                }
            }
        }
        File processedMetadata = layout.buildDirectory.file('resources/main/mcmod.info').get().asFile
        File eclipseMetadata = file('bin/main/mcmod.info')
        if (!eclipseMetadata.isFile()
                || !Arrays.equals(eclipseMetadata.bytes, processedMetadata.bytes)) {
            throw new GradleException('Eclipse output contains stale or unexpanded mcmod.info metadata')
        }
    }
}

