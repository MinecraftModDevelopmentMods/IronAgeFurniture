import java.security.MessageDigest
import org.apache.tools.ant.filters.FixCrLfFilter
import org.gradle.jvm.toolchain.JvmVendorSpec

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

// Recipes and advancements are checked against the committed furniture catalog.
// Regeneration is an explicit task, so importing the project cannot rewrite them.
apply from: 'gradle/furniture-catalog.gradle'
apply from: 'gradle/phase-four-shields.gradle'
apply from: 'gradle/phase-four-upholstery.gradle'

def sha256Of = { File inputFile ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    inputFile.withInputStream { input ->
        byte[] buffer = new byte[8192]
        for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().encodeHex().toString().toUpperCase()
}

group = project.mod_group
version = project.mod_version
base.archivesName = project.mod_archive_name

def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}
def minecraftVersionParts = project.minecraft_version.toString().tokenize('.')
if (minecraftVersionParts.size() < 2 || minecraftVersionParts.size() > 3
        || !minecraftVersionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("minecraft_version must use major.minor or major.minor.patch numeric form: ${project.minecraft_version}")
}
def minecraftPatch = minecraftVersionParts.size() == 3 ? minecraftVersionParts[2] : '0'
def expectedTargetVersion = "${minecraftVersionParts[0]}" +
        "${minecraftVersionParts[1].padLeft(2, '0')}" +
        "${minecraftPatch.padLeft(2, '0')}" + project.loader_code
if (versionParts[3] != expectedTargetVersion) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match " +
            "Minecraft ${project.minecraft_version} ${project.loader_name} target ${expectedTargetVersion}")
}

ext.functional_version = versionParts[0..2].join('.')
ext.display_version = project.mod_version
ext.release_tag = project.mod_version

if (GradleVersion.current() != GradleVersion.version('9.6.1')) {
    throw new GradleException("This build requires Gradle 9.6.1, found ${GradleVersion.current()}")
}
// Buildship normally launches Gradle with the JVM that runs Eclipse. Gradle 9.6.1
// supports newer JVMs, while compilation remains pinned to Temurin Java 8.
if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_17)) {
    throw new GradleException("Gradle requires Java 17 or newer, found ${System.getProperty('java.version')}")
}

// Gradle runs on Java 17, but the mod and its Minecraft launches use Java 8.
def java8Compiler = javaToolchains.compilerFor {
    languageVersion = JavaLanguageVersion.of(8)
    vendor = JvmVendorSpec.ADOPTIUM
}
def java8Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(8)
    vendor = JvmVendorSpec.ADOPTIUM
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = java8Compiler
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xmaxerrs', '1000'])
}

tasks.named('compileTestJava', JavaCompile) {
    options.compilerArgs.add('-proc:none')
}

tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def archiveTextSuffixes = [
        '.cfg', '.css', '.html', '.info', '.java', '.js', '.json', '.lang',
        '.mcmeta', '.md', '.properties', '.txt', '.xml', '.toml'
]
def archiveTextPatterns = archiveTextSuffixes.collect { "**/*${it}".toString() }
archiveTextPatterns.addAll(['**/element-list', '**/package-list'])
def optionalIntegrationExpectedCounts = [
        biomesoplenty        : [recipes: 2189, advancements: 2189],
        immersiveengineering: [recipes: 198, advancements: 198]
]
def normalizeArchiveLineEndings = { details ->
    details.filter(FixCrLfFilter,
            eol: FixCrLfFilter.CrLf.newInstance('lf'),
            eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

tasks.register('verifyBuildEnvironment') {
    group = 'verification'
    description = 'Verifies the supported Gradle runtime and Temurin Java 8 compiler toolchain.'
    doLast {
        def metadata = java8Compiler.get().metadata
        String vendor = metadata.vendor.toString().toLowerCase(Locale.ROOT)
        if (metadata.languageVersion.asInt() != 8
                || !(vendor.contains('eclipse temurin') || vendor.contains('eclipse adoptium'))) {
            throw new GradleException("Java compiler toolchain must be Eclipse Temurin Java 8; " +
                    "found ${metadata.vendor} ${metadata.javaRuntimeVersion} at ${metadata.installationPath}")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('verifyBuildEnvironment')
}

// Keep the Eclipse name stable: saved run configurations refer to this project.
def eclipseWorkspaceProjectName = 'IronAgeFurniture'
eclipse {
    project {
        name = eclipseWorkspaceProjectName
        buildCommand 'org.eclipse.buildship.core.gradleprojectbuilder'
        natures 'org.eclipse.buildship.core.gradleprojectnature'
    }
    classpath {
        downloadSources = true
        downloadJavadoc = true
    }
    synchronizationTasks 'isolateEclipseProductionRuns'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Forge 28 still needs its own userdev launch arguments and environment.
// Do not replace these with the launch setup from a newer Minecraft version.
minecraft {
    mappings channel: project.mcp_mappings_channel, version: project.mcp_mappings_version

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir(
                    providers.gradleProperty('runDirectory').getOrElse('run'))
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            mods {
                ironagefurniture { source sourceSets.main }
            }
        }
        register('client')
        register('server') {
            args '--nogui'
        }
        register('data') {
            workingDir.convention layout.projectDirectory.dir('run-data')
            args '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

def developmentModOutput = layout.buildDirectory.dir('forge-run-mod-classes/main')
def prepareDevelopmentMod = tasks.register('prepareDevelopmentMod', Sync) {
    group = 'ide'
    description = 'Merges production classes and resources for Forge 28 development discovery.'
    dependsOn tasks.named('classes')
    from sourceSets.main.output.classesDirs
    from sourceSets.main.output.resourcesDir
    into developmentModOutput
}

def configureForge28Run = { JavaExec runTask, String launchTarget ->
    runTask.dependsOn prepareDevelopmentMod
    runTask.environment 'target', launchTarget
    runTask.environment 'MCP_MAPPINGS', "${mcp_mappings_channel}_${mcp_mappings_version}"
    runTask.environment 'MCP_VERSION', mcp_version
    runTask.environment 'FORGE_VERSION', forge_version
    runTask.environment 'FORGE_GROUP', 'net.minecraftforge'
    runTask.environment 'MC_VERSION', minecraft_version
    runTask.environment 'MOD_CLASSES', "${project.mod_id}%%${developmentModOutput.get().asFile}${File.pathSeparator}" +
            "${project.mod_id}%%${developmentModOutput.get().asFile}"
    runTask.doFirst {
        File modsDirectory = new File(runTask.workingDir, 'mods')
        if (!modsDirectory.isDirectory() && !modsDirectory.mkdirs()) {
            throw new GradleException("Could not create development mods directory: ${modsDirectory}")
        }
    }
}

tasks.withType(JavaExec).configureEach { JavaExec runTask ->
    String launchTarget = [
            runClient: 'fmluserdevclient',
            runServer: 'fmluserdevserver',
            runData  : 'fmldatauserdev'
    ][runTask.name]
    if (launchTarget != null) {
        configureForge28Run(runTask, launchTarget)
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency(
            "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    testImplementation 'junit:junit:4.13.2'
}

renamer.mappings.from minecraft.dependency.toSrgFile

tasks.withType(Test).configureEach {
    workingDir = project.projectDir
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    def replaceProperties = [
            version                : project.version,
            minecraft_version      : project.minecraft_version,
            forge_version          : project.forge_version,
            forge_version_range    : project.forge_version_range,
            loader_version_range   : project.loader_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)

    from('README.md') {
        into 'META-INF/ironagefurniture/docs'
    }
    from('CHANGELOG.md') {
        into 'META-INF/ironagefurniture/docs'
    }
    from('docs/VERSIONS.md') {
        into 'META-INF/ironagefurniture/docs'
    }
}

def commonManifest = {
    attributes([
            'Specification-Title'       : project.mod_name,
            'Specification-Vendor'      : project.mod_authors,
            'Specification-Version'     : versionParts[0],
            'Implementation-Title'      : base.archivesName.get(),
            'Implementation-Version'    : project.version,
            'Implementation-Vendor'     : project.mod_authors,
            'Maven-Artifact'             : "${project.group}:${base.archivesName.get()}:${project.version}",
            'Built-On-Java'              : project.java_version,
            'Built-On'                   : "${project.minecraft_version}-${project.forge_version}"
    ])
}

tasks.named('jar', Jar) {
    archiveClassifier = 'deobf'
    destinationDirectory = layout.buildDirectory.dir('libs-dev')
    manifest(commonManifest)
}

def releaseJar = renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = null
    output = layout.buildDirectory.file(
            "libs/${base.archivesName.get()}-${project.version}.jar")
}

tasks.named('sourcesJar', Jar) {
    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
    archiveClassifier = 'sources'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}:sources",
                'Implementation-Title'  : "${project.mod_name}-sources",
                'Implementation-Version': project.version
        ])
    }
}

tasks.named('javadocJar', Jar) {
    filteringCharset = 'UTF-8'
    archiveClassifier = 'javadoc'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}:javadoc",
                'Implementation-Title'  : "${project.mod_name}-javadoc",
                'Implementation-Version': project.version
        ])
    }
}

['apiElements', 'runtimeElements'].each { configurationName ->
    configurations.named(configurationName) { artifacts.clear() }
    artifacts { add(configurationName, releaseJar) }
}

tasks.named('assemble') {
    dependsOn releaseJar
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('javadocJar')
}

def expectedReleaseFiles = providers.provider {
    String prefix = "${base.archivesName.get()}-${project.version}"
    ["${prefix}.jar", "${prefix}-sources.jar", "${prefix}-javadoc.jar"]
}
def preparedReleaseDir = providers.gradleProperty('preparedReleaseDir')
def expectedMavenGroup = 'zone.moddev.mc'
def expectedMavenArtifact = 'iron-age-furniture'
def expectedMavenCoordinate = "${expectedMavenGroup}:${expectedMavenArtifact}:${project.version}"

// The longer scripts use these values from the same configured project.
ext.buildSupport = [
        java8Compiler: java8Compiler,
        java8Launcher: java8Launcher,
        sha256Of: sha256Of,
        optionalIntegrationExpectedCounts: optionalIntegrationExpectedCounts,
        expectedReleaseFiles: expectedReleaseFiles,
        preparedReleaseDir: preparedReleaseDir,
        expectedMavenGroup: expectedMavenGroup,
        expectedMavenArtifact: expectedMavenArtifact,
        expectedMavenCoordinate: expectedMavenCoordinate,
        eclipseWorkspaceProjectName: eclipseWorkspaceProjectName,
        archiveTextPatterns: archiveTextPatterns,
        archiveTextSuffixes: archiveTextSuffixes,
        normalizeArchiveLineEndings: normalizeArchiveLineEndings,
        releaseJar: releaseJar
]

apply from: 'gradle/verification/optional-integrations.gradle'
apply from: 'gradle/verification/phase-four-runtime.gradle'
apply from: 'gradle/verification/project-audits.gradle'
apply from: 'gradle/release/artifacts.gradle'
apply from: 'gradle/release/publishing.gradle'
apply from: 'gradle/ide/eclipse.gradle'

tasks.named('check') {
    dependsOn tasks.named('verifyBuildEnvironment')
    dependsOn tasks.named('verifyReleaseConfiguration')
    dependsOn tasks.named('verifyMavenCoordinates')
    dependsOn tasks.named('verifyRepositoryHygiene')
    dependsOn tasks.named('verifyResourceJson')
    dependsOn tasks.named('verifyNamespace')
    dependsOn tasks.named('verifyVersionMetadata')
    dependsOn tasks.named('verifyWorkflowPins')
    dependsOn tasks.named('verifyDedicatedServerBoundaries')
}
