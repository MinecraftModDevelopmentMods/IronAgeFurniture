        copy {
            from processedResources
            into mainOutput
        }

        ['Client', 'Server', 'Data'].each { runName ->
            File launch = [file("run${runName}.launch"), file(".eclipse/run${runName}.launch")]
                    .find { it.isFile() }
            if (launch == null) {
                throw new GradleException("Missing generated Eclipse launch run${runName}.launch")
            }
            String text = launch.getText('UTF-8')
            if (text.contains('<mapAttribute key="org.eclipse.debug.core.environmentVariables"/>')) {
                text = text.replace(
                        '<mapAttribute key="org.eclipse.debug.core.environmentVariables"/>',
                        '<mapAttribute key="org.eclipse.debug.core.environmentVariables">\r\n' +
                        "    <mapEntry key=\"MOD_CLASSES\" value=\"${modClasses}\"/>\r\n" +
                        '</mapAttribute>')
            }
            text = text.replace('<stringAttribute key="org.eclipse.jdt.launching.MAIN_TYPE" value=""/>',
                    "<stringAttribute key=\"org.eclipse.jdt.launching.MAIN_TYPE\" value=\"${mainClass}\"/>")
            text = text.replaceFirst(
                    /<stringAttribute key="org.eclipse.jdt.launching.PROJECT_ATTR" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement(
                            "<stringAttribute key=\"org.eclipse.jdt.launching.PROJECT_ATTR\" value=\"${eclipseWorkspaceProjectName}\"/>"))
            text = text.replaceFirst(/<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement(
                            "<mapEntry key=\"MOD_CLASSES\" value=\"${modClasses}\"/>"))

            def programArguments = text =~ /(<stringAttribute key="org\.eclipse\.jdt\.launching\.PROGRAM_ARGUMENTS" value=")([^"]*)("\/>)/
            if (programArguments.count != 1) {
                throw new GradleException("ForgeGradle generated malformed program arguments in ${launch.name}")
            }
            String arguments = programArguments[0][2]
            ['cache', 'metadata', 'to-srg', 'to-obf'].each { flag ->
                String prefix = "--${flag} "
                int valueStart = arguments.indexOf(prefix)
                int valueEnd = valueStart < 0 ? -1 : arguments.indexOf(' --', valueStart + prefix.length())
                if (valueStart < 0 || valueEnd < 0) {
                    throw new GradleException("ForgeGradle omitted --${flag} from ${launch.name}")
                }
                valueStart += prefix.length()
                String value = arguments.substring(valueStart, valueEnd)
                if (!value.startsWith('&quot;') || !value.endsWith('&quot;')) {
                    arguments = "${arguments.substring(0, valueStart)}&quot;${value}&quot;${arguments.substring(valueEnd)}"
                }
            }
            text = text.replace(programArguments[0][0],
                    programArguments[0][1] + arguments + programArguments[0][3])

            String legacyPrefix = '-DlegacyClassPath.file='
            int legacyStart = text.indexOf(legacyPrefix)
            int legacyEnd = text.indexOf(' -DignoreList=', legacyStart)
            if (legacyStart < 0 || legacyEnd < 0) {
                throw new GradleException("ForgeGradle omitted -DlegacyClassPath.file from ${launch.name}")
            }
            boolean quoted = legacyStart >= 6 && text.substring(legacyStart - 6, legacyStart) == '&quot;'
                    && text.substring(legacyEnd - 6, legacyEnd) == '&quot;'
            if (!quoted) {
                text = text.substring(0, legacyStart) + '&quot;' +
                        text.substring(legacyStart, legacyEnd) + '&quot;' + text.substring(legacyEnd)
            }
            if (!text.contains('ATTR_EXCLUDE_TEST_CODE')) {
                text = text.replace('</launchConfiguration>',
                        '    <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>\r\n' +
                        '</launchConfiguration>')
            }
            launch.setText(text, 'UTF-8')
        }
    }
}

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    description = 'Verifies Buildship and production-only Forge 47 launch metadata.'
    dependsOn tasks.named('syncForge47EclipseLaunches')
    doLast {
        File classpath = file('.classpath')
        File eclipseProject = file('.project')
        if (!classpath.isFile() || !eclipseProject.isFile()
                || !eclipseProject.getText('UTF-8').contains("<name>${eclipseWorkspaceProjectName}</name>")) {
            throw new GradleException('Eclipse project metadata is missing or misnamed')
        }
        def classpathXml = new XmlSlurper(false, false).parse(classpath)
        classpathXml.classpathentry.each { entry ->
            String path = entry.@path.text()
            boolean testSource = path.replace('\\', '/').startsWith('src/test/')
            boolean testLibrary = path ==~ /(?i).*\/(junit|hamcrest|mockito|byte-buddy)[^\/]*\/.*\.jar/
            if (testSource) {
                String scope = entry.attributes.attribute.find {
                    it.@name.text() == 'gradle_scope'
                }?.@value?.text()
                if (entry.@output.text() != 'bin/test' || scope != 'test') {
                    throw new GradleException("Eclipse test source is not isolated: ${path}")
                }
            }
            if (testLibrary) {
                String scope = entry.attributes.attribute.find {
                    it.@name.text() == 'gradle_used_by_scope'
                }?.@value?.text()
                if (scope != 'test') {
                    throw new GradleException("Eclipse production classpath exposes test dependency: ${path}")
                }
            }
        }
        File buildshipPreferences = file('.settings/org.eclipse.buildship.core.prefs')
        if (!buildshipPreferences.isFile()
                || !buildshipPreferences.getText('UTF-8').contains('override.workspace.settings=true')) {
            throw new GradleException('Eclipse Buildship wrapper preferences are missing')
        }
        ['Client', 'Server', 'Data'].each { runName ->
            File launch = [file("run${runName}.launch"), file(".eclipse/run${runName}.launch")]
                    .find { it.isFile() }
            String text = launch.getText('UTF-8')
            if (!text.contains('ATTR_EXCLUDE_TEST_CODE')
                    || text ==~ /(?s).*(?:junit|mockito|src[\\\/]test).*/
                    || !text.contains("key=\"MOD_CLASSES\" value=\"${project.mod_id}%%${new File(projectDir, 'bin/main').absolutePath}\"")
                    || !text.contains("key=\"org.eclipse.jdt.launching.PROJECT_ATTR\" value=\"${eclipseWorkspaceProjectName}\"")) {
                throw new GradleException("Eclipse launch is not production-only: ${launch.name}")
            }
            ['cache', 'metadata', 'to-srg', 'to-obf'].each { flag ->
                if (!text.contains("--${flag} &quot;")) {
                    throw new GradleException("Eclipse launch does not quote --${flag}: ${launch.name}")
                }
            }
            if (!text.contains('&quot;-DlegacyClassPath.file=')
                    || !text.contains('minecraft_classpath.txt&quot; -DignoreList=')) {
                throw new GradleException("Eclipse launch does not quote its legacy classpath: ${launch.name}")
            }
        }
        File processedModsToml = layout.buildDirectory.file(
                'resources/main/META-INF/mods.toml').get().asFile
        File eclipseModsToml = file('bin/main/META-INF/mods.toml')
        if (!eclipseModsToml.isFile()
                || !Arrays.equals(eclipseModsToml.bytes, processedModsToml.bytes)) {
            throw new GradleException('Eclipse output contains stale or unexpanded mods.toml metadata')
        }
    }
}

tasks.matching { it.name == 'genEclipseRuns' }.configureEach {
    finalizedBy tasks.named('syncForge47EclipseLaunches')
}

tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn tasks.named('syncForge47EclipseLaunches')
}

tasks.matching { it.name == 'eclipse' }.configureEach {
    finalizedBy tasks.named('syncForge47EclipseLaunches')
}

tasks.register('prepareEclipse') {
    group = 'ide'
    description = 'Creates the Buildship project model and ForgeGradle 7 launch profiles.'
    dependsOn tasks.named('eclipse')
    dependsOn tasks.named('isolateEclipseProductionRuns')
}

tasks.named('check') {
    dependsOn tasks.named('verifyBuildEnvironment')
    dependsOn tasks.named('verifyReleaseConfiguration')
    dependsOn tasks.named('verifyMavenCoordinates')
    dependsOn tasks.named('verifyRepositoryHygiene')
    dependsOn tasks.named('verifyResourceJson')
    dependsOn tasks.named('verifyNamespace')
    dependsOn tasks.named('verifyVersionMetadata')
    dependsOn tasks.named('verifyWorkflowPins')
    dependsOn tasks.named('verifyDedicatedServerBoundaries')
}

