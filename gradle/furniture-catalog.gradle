import groovy.json.JsonOutput
import groovy.json.JsonSlurper

def catalogFile = layout.projectDirectory.file('gradle/furniture-catalog.json')
def recipeDirectory = layout.projectDirectory.dir('src/main/resources/data/ironagefurniture/recipes')
def advancementDirectory = layout.projectDirectory.dir(
        'src/main/resources/data/ironagefurniture/advancements/recipes/chairs')
def blockStateDirectory = layout.projectDirectory.dir(
        'src/main/resources/assets/ironagefurniture/blockstates')

def integrationForName = { String name ->
    if (name.contains('_biomesoplenty_')) return 'biomesoplenty'
    if (name.contains('_byg_')) return 'byg'
    if (name.contains('_immersiveengineering_')) return 'immersiveengineering'
    return null
}

def orderedCondition = { String modId ->
    [type: 'forge:mod_loaded', modid: modId] as LinkedHashMap
}

def normalizeItemPredicates
normalizeItemPredicates = { Object value ->
    if (value instanceof Map) {
        Map map = value as Map
        if (map.containsKey('item')) {
            Object item = map.remove('item')
            map.items = [item]
        }
        map.values().each { normalizeItemPredicates(it) }
    } else if (value instanceof List) {
        (value as List).each { normalizeItemPredicates(it) }
    }
}

def normalizedRecipe = { File file ->
    Map parsed = new JsonSlurper().parse(file) as Map
    String modId = integrationForName(file.name)
    if (parsed.type == 'forge:conditional') {
        List entries = parsed.recipes as List
        if (entries == null || entries.size() != 1 || !(entries[0].recipe instanceof Map)) {
            throw new GradleException("Unsupported conditional recipe structure: ${file}")
        }
        parsed = new LinkedHashMap(entries[0].recipe as Map)
    }
    // Keep furniture from different woods as distinct recipe-book entries.
    // A shared group makes an unlocked recipe cycle through every wood variant.
    if (parsed.group == 'furniture') {
        parsed.remove('group')
    }
    if (modId != null) {
        Map reordered = new LinkedHashMap()
        reordered.type = parsed.type
        reordered.conditions = [orderedCondition(modId)]
        parsed.each { key, value ->
            if (key != 'type' && key != 'conditions') reordered[key] = value
        }
        parsed = reordered
    }
    return parsed
}

def normalizedAdvancement = { File file ->
    Map parsed = new JsonSlurper().parse(file) as Map
    if (parsed.advancements instanceof List) {
        List entries = parsed.advancements as List
        if (entries.size() != 1 || !(entries[0].advancement instanceof Map)) {
            throw new GradleException("Unsupported conditional advancement structure: ${file}")
        }
        parsed = new LinkedHashMap(entries[0].advancement as Map)
    }

    String recipeId = file.name.substring(0, file.name.length() - '.json'.length())
    String modId = integrationForName(file.name)
    Map reordered = new LinkedHashMap()
    reordered.parent = parsed.parent ?: 'minecraft:recipes/root'
    reordered.rewards = [recipes: ["ironagefurniture:${recipeId}"]]
    reordered.criteria = parsed.criteria
    normalizeItemPredicates(reordered.criteria)
    reordered.criteria.has_the_recipe = [
            trigger: 'minecraft:recipe_unlocked',
            conditions: [recipe: "ironagefurniture:${recipeId}"]
    ]
    reordered.requirements = [reordered.criteria.keySet().toList().sort()]
    if (modId == null) return reordered

    return [
            advancements: [[
                    conditions: [orderedCondition(modId)],
                    advancement: reordered
            ]]
    ] as LinkedHashMap
}

def formattedJson = { Object value -> JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n' }
def writeCatalogText = { File file, String text ->
    file.setText(text.replace('\r\n', '\n').replace('\n', System.lineSeparator()), 'UTF-8')
}

def compatibilityBlockStates = { Map catalog ->
    List<Map<String, String>> mappings = []
    (catalog.woods as Map).values().flatten().each { String modernWood ->
        String legacyWood = modernWood == 'dark_oak' ? 'big_oak' : modernWood
        mappings.add([
                source: "chair_wood_ironage_bench_padded_red_single_${modernWood}",
                target: "chair_wood_ironage_bench_padded_single_${legacyWood}"
        ])
        mappings.add([
                source: "chair_wood_ironage_bench_back_padded_red_single_${modernWood}",
                target: "chair_wood_ironage_bench_back_padded_single_${legacyWood}"
        ])
    }
    mappings
}

tasks.register('updateFurnitureCatalog') {
    group = 'generation'
    description = 'Deterministically rewrites catalog-governed recipes and advancements.'
    inputs.file catalogFile
    inputs.files fileTree(recipeDirectory) { include '*.json' }
    inputs.files fileTree(advancementDirectory) { include '*.json' }
    inputs.files fileTree(blockStateDirectory) { include '*.json' }
    doLast {
        Map catalog = new JsonSlurper().parse(catalogFile.asFile) as Map
        fileTree(recipeDirectory) { include '*.json' }.files.sort { it.name }.each { file ->
            writeCatalogText(file, formattedJson(normalizedRecipe(file)))
        }
        fileTree(advancementDirectory) { include '*.json' }.files.sort { it.name }.each { file ->
            writeCatalogText(file, formattedJson(normalizedAdvancement(file)))
        }
        compatibilityBlockStates(catalog).each { mapping ->
            File source = new File(blockStateDirectory.asFile, "${mapping.source}.json")
            File target = new File(blockStateDirectory.asFile, "${mapping.target}.json")
            writeCatalogText(target, source.getText('UTF-8'))
        }
    }
}

tasks.register('verifyFurnitureCatalog') {
    group = 'verification'
    description = 'Verifies catalog coverage and that committed data is already deterministic.'
    inputs.file catalogFile
    inputs.file file('src/main/java/zone/moddev/mc/ironagefurniture/api/enumerations/BenchType.java')
    inputs.files fileTree(recipeDirectory) { include '*.json' }
    inputs.files fileTree(advancementDirectory) { include '*.json' }
    doLast {
        Map catalog = new JsonSlurper().parse(catalogFile.asFile) as Map
        if (catalog.minecraft != project.minecraft_version.toString() || catalog.loader != project.loader_name) {
            throw new GradleException('Furniture catalog targets the wrong Minecraft version or loader')
        }
        String benchTypes = file(
                'src/main/java/zone/moddev/mc/ironagefurniture/api/enumerations/BenchType.java').getText('UTF-8')
        if (benchTypes.contains('END("end")')) {
            throw new GradleException('Unused BenchType.END creates missing type=end model variants')
        }

        fileTree(recipeDirectory) { include '*.json' }.files.sort { it.name }.each { file ->
            String expected = formattedJson(normalizedRecipe(file))
            if (file.getText('UTF-8').replace('\r\n', '\n') != expected) {
                throw new GradleException("Recipe is not catalog-normalized: ${project.relativePath(file)}")
            }
            Map recipe = new JsonSlurper().parseText(expected) as Map
            if (recipe.group == 'furniture') {
                throw new GradleException("Furniture recipe is incorrectly grouped across woods: " +
                        project.relativePath(file))
            }
        }
        fileTree(advancementDirectory) { include '*.json' }.files.sort { it.name }.each { file ->
            String expected = formattedJson(normalizedAdvancement(file))
            if (file.getText('UTF-8').replace('\r\n', '\n') != expected) {
                throw new GradleException("Advancement is not catalog-normalized: ${project.relativePath(file)}")
            }
            Map parsed = new JsonSlurper().parseText(expected) as Map
            Map advancement = parsed.advancements instanceof List
                    ? parsed.advancements[0].advancement as Map
                    : parsed
            String recipeId = file.name.substring(0, file.name.length() - '.json'.length())
            Map criteria = advancement.criteria as Map
            if (criteria.has_the_recipe?.trigger != 'minecraft:recipe_unlocked'
                    || criteria.has_the_recipe?.conditions?.recipe != "ironagefurniture:${recipeId}") {
                throw new GradleException("Advancement unlocks the wrong recipe: ${project.relativePath(file)}")
            }
            List ingredientCriteria = criteria.findAll { key, value -> key != 'has_the_recipe' }.values() as List
            if (ingredientCriteria.size() != 1
                    || ingredientCriteria[0].trigger != 'minecraft:inventory_changed') {
                throw new GradleException("Advancement needs one exact ingredient criterion: " +
                        project.relativePath(file))
            }
            String criteriaJson = JsonOutput.toJson(ingredientCriteria[0])
            List predicates = ingredientCriteria[0].conditions?.items as List
            if (criteriaJson.contains('minecraft:crafting_table')
                    || predicates == null || predicates.size() != 1
                    || !(predicates[0] instanceof Map)
                    || (!(predicates[0] as Map).items && !(predicates[0] as Map).tag)
                    || (predicates[0] as Map).item != null) {
                throw new GradleException("Advancement uses a generic or crafting-table criterion: " +
                        project.relativePath(file))
            }
        }

        Map expectedCounts = [biomesoplenty: 429, byg: 819, immersiveengineering: 38]
        expectedCounts.each { modId, count ->
            int recipes = fileTree(recipeDirectory) {
                include "*_${modId}_*.json"
            }.files.size()
            int advancements = fileTree(advancementDirectory) {
                include "*_${modId}_*.json"
            }.files.size()
            if (modId == 'immersiveengineering') {
                recipes = fileTree(recipeDirectory) {
                    include '*_immersiveengineering_treated_wood.json'
                }.files.size()
                advancements = fileTree(advancementDirectory) {
                    include '*_immersiveengineering_treated_wood.json'
                }.files.size()
            }
            if (recipes != count || advancements != count) {
                throw new GradleException("Unexpected ${modId} catalog coverage: " +
                        "${recipes} recipes, ${advancements} advancements; expected ${count}")
            }
        }

        File blockStates = file('src/main/resources/assets/ironagefurniture/blockstates')
        File itemModels = file('src/main/resources/assets/ironagefurniture/models/item')
        compatibilityBlockStates(catalog).each { mapping ->
            File source = new File(blockStates, "${mapping.source}.json")
            File target = new File(blockStates, "${mapping.target}.json")
            if (!target.isFile() || target.getText('UTF-8').replace('\r\n', '\n')
                    != source.getText('UTF-8').replace('\r\n', '\n')) {
                throw new GradleException("Legacy padded-bench blockstate is missing or stale: ${mapping.target}")
            }
        }
        catalog.lighting.each { String id ->
            if (!new File(blockStates, "${id}.json").isFile()
                    || !new File(itemModels, "${id}.json").isFile()) {
                throw new GradleException("Lighting catalog entry is missing assets: ${id}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyFurnitureCatalog')
}
