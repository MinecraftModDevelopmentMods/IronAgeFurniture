import groovy.json.JsonSlurper

def furnitureCatalogFile = layout.projectDirectory.file('gradle/furniture-catalog.json')
def furnitureCatalogSnapshot = layout.projectDirectory.file('gradle/furniture-catalog.snapshot')

def readFurnitureCatalog = {
    new JsonSlurper().parse(furnitureCatalogFile.asFile) as Map
}

def catalogSnapshotText = { Map catalog ->
    List<String> lines = [
            "schema=${catalog.schema}",
            "minecraft=${catalog.minecraft}",
            "loader=${catalog.loader}",
            "colours=${(catalog.colours as List).join(',')}"
    ]
    (catalog.woods as Map).each { integration, woods ->
        lines.add("woods.${integration}=${(woods as List).join(',')}")
    }
    lines.add("fireproofWoods=${(catalog.fireproofWoods as List).join(',')}")
    lines.add("lighting=${(catalog.lighting as List).join(',')}")
    lines.join('\n') + '\n'
}

tasks.register('updateFurnitureCatalog') {
    group = 'generation'
    description = 'Regenerates the deterministic Phase 3 catalog snapshot used to audit legacy Java registrations.'
    inputs.file furnitureCatalogFile
    outputs.file furnitureCatalogSnapshot
    doLast {
        Map catalog = readFurnitureCatalog()
        File output = furnitureCatalogSnapshot.asFile
        output.parentFile.mkdirs()
        output.setText(catalogSnapshotText(catalog), 'UTF-8')
    }
}

tasks.register('verifyFurnitureCatalog') {
    group = 'verification'
    description = 'Verifies the 1.10 Java-side catalog, optional registration, recipes, assets, and locales.'
    mustRunAfter tasks.named('updateFurnitureCatalog')
    inputs.file furnitureCatalogFile
    inputs.file furnitureCatalogSnapshot
    inputs.files fileTree('src/main/java') { include '**/*.java' }
    inputs.files fileTree('src/main/resources/assets/ironagefurniture') {
        include 'blockstates/*.json'
        include 'models/item/*.json'
        include 'lang/*.lang'
    }
    doLast {
        Map catalog = readFurnitureCatalog()
        if (catalog.schema != 1 || catalog.minecraft != project.minecraft_version.toString()
                || catalog.loader != project.loader_name.toString()) {
            throw new GradleException('Furniture catalog targets the wrong schema, Minecraft version, or loader')
        }
        String expectedSnapshot = catalogSnapshotText(catalog)
        if (!furnitureCatalogSnapshot.asFile.isFile()
                || furnitureCatalogSnapshot.asFile.getText('UTF-8').replace('\r\n', '\n') != expectedSnapshot) {
            throw new GradleException('Furniture catalog snapshot is stale; run updateFurnitureCatalog')
        }

        File blockInitializer = file(
                'src/main/java/zone/moddev/mc/ironagefurniture/init/BlockInitialiser.java')
        File recipeInitializer = file(
                'src/main/java/zone/moddev/mc/ironagefurniture/init/RecipeInitialiser.java')
        String blockSource = blockInitializer.getText('UTF-8')
        String recipeSource = recipeInitializer.getText('UTF-8')
        File benchTypeSource = file(
                'src/main/java/zone/moddev/mc/ironagefurniture/api/Enumerations/BenchType.java')
        String benchTypes = benchTypeSource.getText('UTF-8')
        if (benchTypes.contains('END("end")')) {
            throw new GradleException('Unused BenchType.END creates missing type=end model variants')
        }
        Map<String, String> optionalModIds = [
                biomesoplenty: 'BiomesOPlenty',
                natura: 'natura',
                forestry: 'forestry',
                immersiveengineering: 'immersiveengineering'
        ]
        optionalModIds.each { catalogName, modId ->
            String loaderCheck = "Loader.isModLoaded(\"${modId}\")"
            if (!blockSource.contains(loaderCheck) || !recipeSource.contains(loaderCheck)) {
                throw new GradleException("${catalogName} is not conditionally registered and recipe-gated by ${loaderCheck}")
            }
        }

        List<String> forbiddenPhaseFourContent = [
                'candle', 'chandelier', 'hanging_inn_sign', 'wingback', 'throne',
                'chair_wood_ironage_bed', 'table_wood_', 'shelf_wood_', 'cabinet_wood_',
                'PowerAdvantage', 'poweradvantage'
        ]
        String maintainedSource = blockSource + '\n' + recipeSource
        forbiddenPhaseFourContent.each { value ->
            if (maintainedSource.contains(value)) {
                throw new GradleException("Phase 4/1.0-only content leaked into the Phase 3 catalog: ${value}")
            }
        }

        (catalog.woods as Map).each { integration, woods ->
            (woods as List).each { String wood ->
                if (!blockSource.contains("_${wood}\"") || !recipeSource.contains("_${wood}")) {
                    throw new GradleException("Catalog wood is missing registration or Java recipe coverage: ${wood}")
                }
            }
        }

        Set<String> registeredIds = [] as TreeSet<String>
        def registrationMatcher = blockSource =~ /FurnitureFactory\.Create\w*\(\"([^\"]+)\"/
        registrationMatcher.each { match -> registeredIds.add(match[1].toString()) }
        if (registeredIds.isEmpty()) {
            throw new GradleException('No furniture registrations were discovered')
        }

        File blockstateRoot = file('src/main/resources/assets/ironagefurniture/blockstates')
        File itemModelRoot = file('src/main/resources/assets/ironagefurniture/models/item')
        registeredIds.each { String id ->
            boolean hiddenRedstoneState = id ==~ /light_metal_ironage_(?:block|sconce)_(?:floor|wall)_red_(?:clear|iron)_.+/
            if (!new File(blockstateRoot, "${id}.json").isFile()
                    || (!hiddenRedstoneState && !new File(itemModelRoot, "${id}.json").isFile())) {
                throw new GradleException("Registered furniture is missing blockstate or item model: ${id}")
            }
        }
        (catalog.lighting as List).each { String id ->
            if (!new File(blockstateRoot, "${id}.json").isFile()
                    || !new File(itemModelRoot, "${id}.json").isFile()) {
                throw new GradleException("Lighting catalog entry is missing assets: ${id}")
            }
        }

        if (!recipeSource.contains('generateLightRecipes();')
                || !recipeSource.contains('AddIronSconceRecipe')
                || !recipeSource.contains('Items.GLOWSTONE_DUST')
                || !recipeSource.contains('Items.REDSTONE')
                || !recipeSource.contains('Items.LAVA_BUCKET')
                || !recipeSource.contains('Blocks.OBSIDIAN')
                || !recipeSource.contains('BlockObjectHolder.obsidian_chunk')) {
            throw new GradleException('Phase 3 Java-side lighting recipes are incomplete')
        }
        if (file('src/main/resources/assets/ironagefurniture/recipes').exists()
                || file('src/main/resources/assets/ironagefurniture/advancements').exists()) {
            throw new GradleException('Minecraft 1.10 must use Java-side recipes and must not package later JSON recipe data')
        }

        Map<String, Map<String, String>> locales = [:]
        fileTree('src/main/resources/assets/ironagefurniture/lang') { include '*.lang' }
                .files.sort { it.name }.each { File locale ->
            Map<String, String> entries = [:]
            locale.readLines('UTF-8').findAll { it && !it.startsWith('#') }.each { String line ->
                int separator = line.indexOf('=')
                if (separator <= 0) throw new GradleException("Malformed locale entry in ${locale}: ${line}")
                String key = line.substring(0, separator)
                if (entries.put(key, line.substring(separator + 1)) != null) {
                    throw new GradleException("Duplicate locale key ${key} in ${locale}")
                }
            }
            locales[locale.name] = entries
        }
        if (locales.size() != 3 || locales.values().collect { it.keySet() as Set }.toSet().size() != 1) {
            throw new GradleException('The three English locale files must have identical key sets')
        }
        ['light_metal_ironage_sconce_floor_empty_iron',
         'light_metal_ironage_block_floor_glow_clear',
         'light_metal_ironage_block_floor_red_clear',
         'light_metal_ironage_block_floor_lava_clear', 'obsidian_chunk'].each { String id ->
            String key = "tile.ironagefurniture.${id}.name"
            if (!locales.values().every { it.containsKey(key) }) {
                throw new GradleException("Phase 3 locale key is missing: ${key}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyFurnitureCatalog')
}
