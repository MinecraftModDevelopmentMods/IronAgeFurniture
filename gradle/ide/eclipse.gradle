// ForgeGradle generates Eclipse launches with a broad Buildship classpath.
// The normal client/server launches need only runtime jars, not test probes.

def obsoleteForgeGradle2EclipseLaunches = [
        'IronAgeFurniture_Client.launch': 'GradleStart',
        'IronAgeFurniture_Server.launch': 'GradleStartServer'
]

def slimeLauncherPathBoundaries = [
        ['--cache', '--metadata'],
        ['--metadata', '--to-srg'],
        ['--to-srg', '--to-obf'],
        ['--to-obf', '--']
]

def quoteSlimeLauncherPathArguments = { String contents ->
    slimeLauncherPathBoundaries.each { List<String> boundary ->
        String option = boundary[0]
        String nextOption = boundary[1]
        java.util.regex.Pattern pattern = java.util.regex.Pattern.compile(
                java.util.regex.Pattern.quote(option + ' ') + '(.+?)' +
                        java.util.regex.Pattern.quote(' ' + nextOption))
        java.util.regex.Matcher matcher = pattern.matcher(contents)
        if (matcher.find()) {
            String value = matcher.group(1)
            if (!(value.startsWith('&quot;') && value.endsWith('&quot;'))) {
                String replacement = option + ' &quot;' + value + '&quot; ' + nextOption
                contents = matcher.replaceFirst(java.util.regex.Matcher.quoteReplacement(replacement))
            }
        }
    }
    contents
}

def eclipseXmlEscape = { String value ->
    value.replace('&', '&amp;')
            .replace('"', '&quot;')
            .replace('<', '&lt;')
            .replace('>', '&gt;')
}

def eclipseArchiveLaunchEntry = { File archive ->
    String memento = '<?xml version="1.0" encoding="UTF-8" standalone="no"?>' \
            + '<runtimeClasspathEntry externalArchive="' + archive.canonicalPath \
            + '" type="2" path="5" />'
    '    <listEntry value="' + eclipseXmlEscape(memento) + '"/>'
}

def replaceBuildshipLaunchClasspath = { String contents, Collection<File> archives ->
    // One generated Buildship entry is replaced with the actual runtime jars;
    // duplicate entries can hide missing dependencies and break Eclipse sync.
    List<String> lines = contents.replace('\r\n', '\n').split('\n', -1) as List<String>
    List<Integer> buildshipLines = (0..<lines.size()).findAll {
        lines[it].contains('org.eclipse.buildship.core.gradleclasspathcontainer')
    }
    if (buildshipLines.size() != 1) {
        throw new GradleException("Expected one Buildship launch classpath entry, found ${buildshipLines.size()}")
    }
    List<File> uniqueArchives = archives.collect { it.canonicalFile }
            .unique { File archive -> archive.path.toLowerCase(Locale.ROOT) }
            .sort { File left, File right -> left.path.compareToIgnoreCase(right.path) }
    List<File> missingArchives = uniqueArchives.findAll { !it.isFile() }
    if (!missingArchives.isEmpty()) {
        throw new GradleException("Eclipse launch archives are missing: ${missingArchives}")
    }
    lines[buildshipLines[0]] = uniqueArchives.collect(eclipseArchiveLaunchEntry).join('\n')
    lines.join('\n')
}

eclipse {
    project {
        buildCommand 'org.eclipse.buildship.core.gradleprojectbuilder'
        natures 'org.eclipse.buildship.core.gradleprojectnature'
    }
    classpath {
        downloadSources = true
        downloadJavadoc = true
        file.withXml { provider ->
            Node classpath = provider.asNode()
            classpath.classpathentry.findAll { it.@kind == 'lib' }.each {
                classpath.remove(it)
            }
            if (!classpath.classpathentry.any {
                    it.@kind == 'con' && it.@path == 'org.eclipse.buildship.core.gradleclasspathcontainer'
            }) {
                classpath.appendNode('classpathentry', [
                        kind: 'con', path: 'org.eclipse.buildship.core.gradleclasspathcontainer'
                ])
            }
        }
    }
    synchronizationTasks 'isolateEclipseProductionRuns'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('configureEclipseBuildship') {
    group = 'ide'
    description = 'Creates Buildship wrapper and project-cache preferences.'
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        [
                'eclipse.preferences.version'     : '1',
                'connection.gradle.distribution' : 'GRADLE_DISTRIBUTION(WRAPPER)',
                'connection.gradle.user.home'    : gradle.gradleUserHomeDir.canonicalPath,
                'connection.project.dir'         : '',
                'gradle.user.home'                : gradle.gradleUserHomeDir.canonicalPath,
                'override.workspace.settings'    : 'true'
        ].each { key, value -> preferences.setProperty(key, value) }
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream {
            preferences.store(it, 'Generated by configureEclipseBuildship.')
        }
    }
}

tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    description = 'Generates runtime-isolated ForgeGradle 7 Eclipse client and server launches.'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn tasks.named('configureEclipseBuildship')

    doLast {
        // An old ForgeGradle 2 launch can survive an Eclipse re-import and run
        // GradleStart instead of the current ForgeGradle 7 entry point.
        obsoleteForgeGradle2EclipseLaunches.each { String name, String mainClass ->
            File launch = file(name)
            if (launch.isFile()) {
                String contents = launch.getText('UTF-8')
                String obsoleteMainType =
                        "org.eclipse.jdt.launching.MAIN_TYPE\" value=\"${mainClass}\""
                if (contents.contains(obsoleteMainType) && !launch.delete()) {
                    throw new GradleException("Could not remove obsolete ForgeGradle 2 launch ${name}")
                }
            }
        }

        List<File> allRunLaunches = [
                file('runClient.launch'), file('runServer.launch'),
                file('runTestClient.launch'), file('runTestServer.launch'),
                file('.eclipse/runClient.launch'), file('.eclipse/runServer.launch'),
                file('.eclipse/runTestClient.launch'), file('.eclipse/runTestServer.launch')
        ].findAll { it.isFile() }
        allRunLaunches.each { File launch ->
            String contents = quoteSlimeLauncherPathArguments(launch.getText('UTF-8'))
            launch.setText(contents.replace('\r\n', '\n'), 'UTF-8')
        }

        List<File> runLaunches = [
                file('runClient.launch'), file('runServer.launch'),
                file('.eclipse/runClient.launch'), file('.eclipse/runServer.launch')
        ].findAll { it.isFile() }
        if (runLaunches.size() < 2) {
            throw new GradleException('ForgeGradle did not generate ordinary client/server Eclipse launches')
        }
        List<File> runtimeArchives = configurations.runtimeClasspath.files as List<File>
        runLaunches.each { File launch ->
            String contents = launch.getText('UTF-8')
            if (!contents.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                String marker = '</launchConfiguration>'
                String attribute =
                        '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>'
                contents = contents.replace(marker, attribute + '\n' + marker)
            }
            String isolatedContents = replaceBuildshipLaunchClasspath(contents, runtimeArchives)
            launch.setText(isolatedContents.replace('\r\n', '\n'), 'UTF-8')
        }
    }
}

tasks.register('prepareEclipse') {
    group = 'ide'
    description = 'Creates the Buildship project model and ForgeGradle 7 launch profiles.'
    dependsOn tasks.named('eclipse')
    dependsOn tasks.named('isolateEclipseProductionRuns')
}

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    description = 'Verifies Buildship classpath use and production-only FG7 launches.'
    dependsOn tasks.named('prepareEclipse')

    doLast {
        File classpathFile = file('.classpath')
        String classpathText = classpathFile.getText('UTF-8')
        if (!classpathText.contains('org.eclipse.buildship.core.gradleclasspathcontainer')) {
            throw new GradleException('Eclipse classpath does not use the Buildship Gradle container')
        }

        File buildshipPreferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties buildshipPreferences = new Properties()
        buildshipPreferencesFile.withInputStream { buildshipPreferences.load(it) }
        if (buildshipPreferences.getProperty('connection.gradle.distribution') != 'GRADLE_DISTRIBUTION(WRAPPER)'
                || file(buildshipPreferences.getProperty('connection.gradle.user.home', '')).canonicalFile
                != gradle.gradleUserHomeDir.canonicalFile
                || buildshipPreferences.getProperty('override.workspace.settings') != 'true') {
            throw new GradleException('Eclipse Buildship does not use this wrapper and shared Gradle home')
        }
        if (buildshipPreferences.getProperty('java.home', '').trim()) {
            throw new GradleException('Eclipse Buildship preferences must not pin a machine-specific Gradle Java home')
        }
        if (classpathText.contains('<classpathentry kind="lib"')
                || classpathText ==~ /(?s).*<classpathentry[^>]+path="[A-Za-z]:[\\\/].*/) {
            throw new GradleException('Eclipse classpath contains an absolute library entry')
        }
        obsoleteForgeGradle2EclipseLaunches.each { String name, String mainClass ->
            File launch = file(name)
            if (launch.isFile() && launch.getText('UTF-8').contains(
                    "org.eclipse.jdt.launching.MAIN_TYPE\" value=\"${mainClass}\"")) {
                throw new GradleException("Obsolete ForgeGradle 2 launch remains at ${name}")
            }
        }
        List<File> launchFiles = [
                file('runClient.launch'), file('runServer.launch'),
                file('.eclipse/runClient.launch'), file('.eclipse/runServer.launch')
        ].findAll { it.isFile() }
        if (launchFiles.size() < 2 || launchFiles.any {
                String text = it.getText('UTF-8')
                !text.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')
                        || !text.contains('value="true"')
        }) {
            throw new GradleException('Generated Eclipse launches do not consistently exclude test code')
        }
        launchFiles.each { File launch ->
            String text = launch.getText('UTF-8')
            if (text.contains('org.eclipse.buildship.core.gradleclasspathcontainer')) {
                throw new GradleException("${launch.name} still uses the Buildship classpath container")
            }
        }
        List<File> allLaunchFiles = [
                file('runClient.launch'), file('runServer.launch'),
                file('runTestClient.launch'), file('runTestServer.launch'),
                file('.eclipse/runClient.launch'), file('.eclipse/runServer.launch'),
                file('.eclipse/runTestClient.launch'), file('.eclipse/runTestServer.launch')
        ].findAll { it.isFile() }
        allLaunchFiles.each { File launch ->
            String text = launch.getText('UTF-8')
            slimeLauncherPathBoundaries.each { List<String> boundary ->
                String option = boundary[0]
                String nextOption = boundary[1]
                java.util.regex.Pattern quotedPath = java.util.regex.Pattern.compile(
                        java.util.regex.Pattern.quote(option + ' &quot;') + '(.+?)' +
                                java.util.regex.Pattern.quote('&quot; ' + nextOption))
                java.util.regex.Matcher matcher = quotedPath.matcher(text)
                if (!matcher.find()) {
                    throw new GradleException("${launch.name} does not quote ${option} path")
                }
                File target = new File(matcher.group(1))
                if (!target.exists()) {
                    throw new GradleException("${launch.name} ${option} path does not exist: ${target}")
                }
            }
        }
    }
}
