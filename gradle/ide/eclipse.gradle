import groovy.xml.XmlSlurper
import java.util.Arrays

def eclipseWorkspaceProjectName = iafBuild.eclipseWorkspaceProjectName

// ForgeGradle launches need the nested project's real Eclipse name and merged resources.
tasks.register('syncForge12EclipseLaunches') {
    group = 'ide'
    description = 'Synchronizes processed resources and hardens Forge 1.12 Eclipse launches.'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn tasks.named('processResources')
    dependsOn tasks.named('verifyBuildEnvironment')
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        if (preferencesFile.isFile()) {
            preferencesFile.withInputStream { preferences.load(it) }
        }
        [
                'eclipse.preferences.version'    : '1',
                'connection.gradle.distribution': 'GRADLE_DISTRIBUTION(WRAPPER)',
                'connection.gradle.user.home'   : gradle.gradleUserHomeDir.canonicalPath,
                'connection.project.dir'        : '',
                'gradle.user.home'               : gradle.gradleUserHomeDir.canonicalPath,
                'override.workspace.settings'   : 'true'
        ].each { key, value -> preferences.setProperty(key, value) }
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream {
            preferences.store(it, 'Generated by syncForge12EclipseLaunches.')
        }

        File mainOutput = file('bin/main')
        copy {
            from layout.buildDirectory.dir('resources/main')
            into mainOutput
        }

        ['runClient.launch', 'runServer.launch'].each { name ->
            File launch = [file(name), file(".eclipse/${name}")].find { it.isFile() }
            if (launch == null) {
                throw new GradleException("ForgeGradle did not generate ${name}")
            }
            String contents = launch.getText('UTF-8')
            def programArguments = contents =~ /(<stringAttribute key="org\.eclipse\.jdt\.launching\.PROGRAM_ARGUMENTS" value=")([^"]*)("\/>)/
            if (programArguments.count != 1) {
                throw new GradleException("ForgeGradle generated malformed program arguments in ${name}")
            }
            String arguments = programArguments[0][2]
            ['cache', 'metadata', 'to-srg', 'to-obf'].each { flag ->
                String prefix = "--${flag} "
                int valueStart = arguments.indexOf(prefix)
                if (valueStart < 0) throw new GradleException("ForgeGradle omitted --${flag} from ${name}")
                valueStart += prefix.length()
                int valueEnd = arguments.indexOf(' --', valueStart)
                if (valueEnd < 0) throw new GradleException("ForgeGradle generated an unterminated --${flag} path")
                String value = arguments.substring(valueStart, valueEnd)
                if (!value.startsWith('&quot;') || !value.endsWith('&quot;')) {
                    arguments = "${arguments.substring(0, valueStart)}&quot;${value}&quot;${arguments.substring(valueEnd)}"
                }
            }
            contents = contents.replace(programArguments[0][0],
                    programArguments[0][1] + arguments + programArguments[0][3])
            if (!contents.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                contents = contents.replace('</launchConfiguration>',
                        '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>'
                        + System.lineSeparator() + '</launchConfiguration>')
            }
            contents = contents.replaceFirst(
                    /<stringAttribute key="org\.eclipse\.jdt\.launching\.PROJECT_ATTR" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement(
                            "<stringAttribute key=\"org.eclipse.jdt.launching.PROJECT_ATTR\" value=\"${eclipseWorkspaceProjectName}\"/>"))
            String eclipseModClasses = mainOutput.absolutePath
            if (contents.contains('key="MOD_CLASSES"')) {
                contents = contents.replaceAll(/<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                        java.util.regex.Matcher.quoteReplacement(
                                "<mapEntry key=\"MOD_CLASSES\" value=\"${eclipseModClasses}\"/>"))
            } else {
                contents = contents.replace('  </mapAttribute>',
                        "    <mapEntry key=\"MOD_CLASSES\" value=\"${eclipseModClasses}\"/>"
                        + System.lineSeparator() + '  </mapAttribute>')
            }
            launch.setText(contents, 'UTF-8')
        }
    }
}

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    description = 'Verifies Buildship and production-only Forge 1.12 launch metadata.'
    dependsOn tasks.named('eclipse')
    dependsOn tasks.named('syncForge12EclipseLaunches')
    doLast {
        File classpath = file('.classpath')
        File eclipseProject = file('.project')
        if (!classpath.isFile() || !eclipseProject.isFile()
                || !eclipseProject.getText('UTF-8').contains("<name>${eclipseWorkspaceProjectName}</name>")) {
            throw new GradleException('Eclipse project metadata is missing or misnamed')
        }
        def classpathXml = new XmlSlurper(false, false).parse(classpath)
        classpathXml.classpathentry.each { entry ->
            String path = entry.@path.text()
            boolean testSource = path.replace('\\', '/').startsWith('src/test/')
            boolean testLibrary = path ==~ /(?i).*\/(junit|hamcrest|mockito|byte-buddy)[^\/]*\/.*\.jar/
            if (testSource) {
                String scope = entry.attributes.attribute.find {
                    it.@name.text() == 'gradle_scope'
                }?.@value?.text()
                if (entry.@output.text() != 'bin/test' || scope != 'test') {
                    throw new GradleException("Eclipse test source is not isolated: ${path}")
                }
            }
            if (testLibrary) {
                String scope = entry.attributes.attribute.find {
                    it.@name.text() == 'gradle_used_by_scope'
                }?.@value?.text()
                if (scope != 'test') {
                    throw new GradleException("Eclipse production classpath exposes test dependency: ${path}")
                }
            }
        }
        File buildshipPreferences = file('.settings/org.eclipse.buildship.core.prefs')
        if (!buildshipPreferences.isFile()
                || !buildshipPreferences.getText('UTF-8').contains('override.workspace.settings=true')) {
            throw new GradleException('Eclipse Buildship wrapper preferences are missing')
        }
        ['Client', 'Server'].each { runName ->
            File launch = [file("run${runName}.launch"), file(".eclipse/run${runName}.launch")]
                    .find { it.isFile() }
            String text = launch.getText('UTF-8')
            String mainOutput = new File(projectDir, 'bin/main').absolutePath
            String expectedModClasses = mainOutput
            if (!text.contains('ATTR_EXCLUDE_TEST_CODE')
                    || text ==~ /(?s).*(?:junit|mockito|src[\\\/]test).*/
                    || !text.contains(expectedModClasses)
                    || !text.contains("key=\"org.eclipse.jdt.launching.PROJECT_ATTR\" value=\"${eclipseWorkspaceProjectName}\"")) {
                throw new GradleException("Eclipse launch is not production-only: ${launch.name}")
            }
            ['cache', 'metadata', 'to-srg', 'to-obf'].each { flag ->
                if (!text.contains("--${flag} &quot;")) {
                    throw new GradleException("Eclipse launch does not quote --${flag}: ${launch.name}")
                }
            }
        }
        File processedMetadata = layout.buildDirectory.file('resources/main/mcmod.info').get().asFile
        File eclipseMetadata = file('bin/main/mcmod.info')
        if (!eclipseMetadata.isFile()
                || !Arrays.equals(eclipseMetadata.bytes, processedMetadata.bytes)) {
            throw new GradleException('Eclipse output contains stale or unexpanded mcmod.info metadata')
        }
    }
}

tasks.matching { it.name == 'genEclipseRuns' }.configureEach {
    finalizedBy tasks.named('syncForge12EclipseLaunches')
}

tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn tasks.named('syncForge12EclipseLaunches')
}

tasks.matching { it.name == 'eclipse' }.configureEach {
    finalizedBy tasks.named('syncForge12EclipseLaunches')
}

tasks.register('prepareEclipse') {
    group = 'ide'
    description = 'Creates the Buildship project model and ForgeGradle 7 launch profiles.'
    dependsOn tasks.named('eclipse')
    dependsOn tasks.named('isolateEclipseProductionRuns')
}
