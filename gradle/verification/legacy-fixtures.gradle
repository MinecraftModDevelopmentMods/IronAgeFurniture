// Committed migration samples must match the current 1.12 NBT writer.
def legacyFixtureDirectory = file('src/test/resources/fixtures')
def legacyFixtureVerificationDirectory = layout.buildDirectory.dir('verification/legacy-migration-fixtures')

tasks.register('updateLegacyMigrationFixtures', JavaExec) {
    group = 'generation'
    description = 'Writes deterministic 1.12 migration fixtures with the target NBT implementation.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'zone.moddev.mc.ironagefurniture.fixture.LegacyMigrationFixtureGenerator'
    args legacyFixtureDirectory.absolutePath
}

tasks.register('generateLegacyMigrationFixturesForVerification', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'zone.moddev.mc.ironagefurniture.fixture.LegacyMigrationFixtureGenerator'
    args legacyFixtureVerificationDirectory.get().asFile.absolutePath
    doFirst {
        delete legacyFixtureVerificationDirectory
    }
}

tasks.register('verifyLegacyMigrationFixtures') {
    group = 'verification'
    dependsOn tasks.named('generateLegacyMigrationFixturesForVerification')
    doLast {
        ['iaf-1.12-red-only.nbt', 'iaf-1.12-multicolour.nbt'].each { name ->
            File committed = new File(legacyFixtureDirectory, name)
            File generated = new File(legacyFixtureVerificationDirectory.get().asFile, name)
            if (!committed.isFile() || !java.util.Arrays.equals(committed.bytes, generated.bytes)) {
                throw new GradleException("Legacy migration fixture ${name} is missing or stale; run updateLegacyMigrationFixtures")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyLegacyMigrationFixtures')
}
