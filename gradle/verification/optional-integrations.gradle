tasks.register('verifyOptionalIntegrationMods') {
    group = 'verification'
    description = 'Verifies the pinned third-party jars for the positive optional-integration test.'
    inputs.file optionalIntegrationManifestFile
    doLast {
        Map manifest = new JsonSlurper().parse(optionalIntegrationManifestFile.asFile) as Map
        Set<String> integrationIds = manifest.mods instanceof List
                ? manifest.mods.findAll { it.role == 'integration' }
                        .collect { it.modId.toString() } as Set<String>
                : [] as Set<String>
        if (manifest.minecraft != project.minecraft_version.toString()
                || integrationIds != optionalIntegrationExpectedCounts.keySet()) {
            throw new GradleException('Optional-integration mod manifest is incomplete or targets the wrong game')
        }
        File modsDirectory = file(providers.gradleProperty('optionalIntegrationModsDir')
                .orElse(optionalIntegrationSourceModsDirectory.asFile.absolutePath).get())
        Map<String, File> integrationJars = [:]
        manifest.mods.each { mod ->
            File candidate = new File(modsDirectory, mod.file.toString())
            if (!candidate.isFile()) {
                throw new GradleException("Missing optional-integration test mod ${candidate.name} in " +
                        modsDirectory)
            }
            String actual = sha256Of(candidate)
            if (!actual.equalsIgnoreCase(mod.sha256.toString())) {
                throw new GradleException("Checksum mismatch for optional-integration test mod " +
                        "${candidate.name}: expected ${mod.sha256}, found ${actual}")
            }
            new ZipFile(candidate).withCloseable { ZipFile zip ->
                def metadataEntry = zip.getEntry('META-INF/mods.toml')
                if (metadataEntry == null) {
                    throw new GradleException("${candidate.name} has no META-INF/mods.toml")
                }
                String metadata = zip.getInputStream(metadataEntry)
                        .withCloseable { it.getText('UTF-8') }
                if (!(metadata =~ /modId\s*=\s*["']${java.util.regex.Pattern.quote(mod.modId.toString())}["']/).find()) {
                    throw new GradleException("${candidate.name} does not declare mod ID ${mod.modId}")
                }
            }
            if (mod.role == 'integration') integrationJars[mod.modId.toString()] = candidate
        }

        Map<String, Set<String>> externalTextures = integrationJars.keySet().collectEntries {
            [(it): new TreeSet<String>()]
        }
        fileTree('src/main/resources/assets/ironagefurniture/models') { include '**/*.json' }
                .files.each { model ->
            String text = model.getText('UTF-8')
            integrationJars.keySet().each { modId ->
                def matcher = text =~ /["']${java.util.regex.Pattern.quote(modId)}:([^"']+)["']/
                matcher.each { match ->
                    String path = match[1].toString()
                    if (path.startsWith('block/') || path.startsWith('item/')) {
                        externalTextures[modId].add("assets/${modId}/textures/${path}.png")
                    }
                }
            }
        }
        externalTextures.each { modId, paths ->
            new ZipFile(integrationJars[modId]).withCloseable { ZipFile zip ->
                Collection<String> missing = paths.findAll { zip.getEntry(it) == null }
                if (!missing.isEmpty()) {
                    throw new GradleException("${integrationJars[modId].name} is missing referenced " +
                            "textures: ${missing}")
                }
            }
        }
    }
}

tasks.register('generateOptionalIntegrationFixtureData') {
    group = 'verification'
    description = 'Generates the exact conditional recipe and advancement IDs for the runtime probe.'
    File recipeRoot = file('src/main/resources/data/ironagefurniture/recipes')
    File advancementRoot = file('src/main/resources/data/ironagefurniture/advancements')
    inputs.files fileTree(recipeRoot) { include '**/*.json' }
    inputs.files fileTree(advancementRoot) { include '**/*.json' }
    outputs.dir optionalIntegrationFixtureGeneratedResources
    doLast {
        Map<String, Integer> recipeCounts = optionalIntegrationExpectedCounts.collectEntries {
            modId, counts -> [(modId): 0]
        }
        Map<String, Integer> advancementCounts = optionalIntegrationExpectedCounts.collectEntries {
            modId, counts -> [(modId): 0]
        }
        List<String> recipes = []
        fileTree(recipeRoot) { include '**/*.json' }.files.each { recipeFile ->
            Map recipe = new JsonSlurper().parse(recipeFile) as Map
            List<Map> matching = recipe.conditions instanceof List
                    ? recipe.conditions.findAll { condition ->
                        condition instanceof Map && condition.type == 'forge:mod_loaded'
                                && optionalIntegrationExpectedCounts.containsKey(condition.modid)
                    } as List<Map> : []
            if (matching.size() == 1) {
                String modId = matching[0].modid
                String path = recipeRoot.toPath().relativize(recipeFile.toPath()).toString()
                        .replace('\\', '/').replaceFirst(/\.json$/, '')
                recipes.add("${modId}=ironagefurniture:${path}")
                recipeCounts[modId]++
            }
        }
        List<String> advancements = []
        fileTree(advancementRoot) { include '**/*.json' }.files.each { advancementFile ->
            Map advancement = new JsonSlurper().parse(advancementFile) as Map
            Object conditions = advancement.advancements instanceof List
                    ? advancement.advancements.collectMany { it.conditions ?: [] }
                    : advancement.conditions
            List<Map> matching = conditions instanceof List
                    ? conditions.findAll { condition ->
                        condition instanceof Map && condition.type == 'forge:mod_loaded'
                                && optionalIntegrationExpectedCounts.containsKey(condition.modid)
                    } as List<Map> : []
            if (matching.size() == 1) {
                String modId = matching[0].modid
                String path = advancementRoot.toPath().relativize(advancementFile.toPath()).toString()
                        .replace('\\', '/').replaceFirst(/\.json$/, '')
                advancements.add("${modId}=ironagefurniture:${path}")
                advancementCounts[modId]++
            }
        }
        optionalIntegrationExpectedCounts.each { modId, expected ->
            if (recipeCounts[modId] != expected.recipes
                    || advancementCounts[modId] != expected.advancements) {
                throw new GradleException("Unexpected ${modId} fixture inventory: " +
                        "${recipeCounts[modId]} recipes and ${advancementCounts[modId]} advancements")
            }
        }
        File output = optionalIntegrationFixtureGeneratedResources.get().asFile
        output.mkdirs()
        new File(output, 'expected-conditional-recipes.txt')
                .setText(recipes.sort().join('\n') + '\n', 'UTF-8')
        new File(output, 'expected-conditional-advancements.txt')
                .setText(advancements.sort().join('\n') + '\n', 'UTF-8')
    }
}

tasks.register('compileOptionalIntegrationFixture', JavaCompile) {
    group = 'verification'
    description = 'Compiles the test-only Forge probe for positive optional-integration validation.'
    dependsOn tasks.named('classes')
    source fileTree('src/optionalIntegrationTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDirectory = optionalIntegrationFixtureClasses
    javaCompiler = java16Compiler
    options.encoding = 'UTF-8'
    options.release = 16
    options.compilerArgs.add('-proc:none')
}

def optionalIntegrationFixtureDeobfJar = tasks.register(
        'optionalIntegrationFixtureDeobfJar', Jar) {
    group = 'verification'
    description = 'Builds the development-named optional-integration runtime probe.'
    dependsOn tasks.named('compileOptionalIntegrationFixture')
    dependsOn tasks.named('generateOptionalIntegrationFixtureData')
    archiveFileName = 'ironagefurniture-optional-integration-probe-deobf.jar'
    destinationDirectory = layout.buildDirectory.dir('optional-integration-fixture')
    from optionalIntegrationFixtureClasses
    from 'src/optionalIntegrationTest/resources'
    from optionalIntegrationFixtureGeneratedResources
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}

def optionalIntegrationFixtureJarFile = layout.buildDirectory.file(
        'optional-integration-fixture/ironagefurniture-optional-integration-probe.jar')
def reobfOptionalIntegrationFixtureJar = renamer.classes(optionalIntegrationFixtureDeobfJar) {
    map.from minecraft.dependency.toSrgFile
    output = optionalIntegrationFixtureJarFile
}

tasks.register('optionalIntegrationFixtureJar') {
    group = 'verification'
    description = 'Builds the non-published packaged-server optional-integration probe.'
    dependsOn reobfOptionalIntegrationFixtureJar
    outputs.file optionalIntegrationFixtureJarFile
}

tasks.register('stageOptionalIntegrationFixture', Copy) {
    group = 'verification'
    description = 'Stages the verified integration mods and runtime probe in the packaged server.'
    dependsOn tasks.named('verifyOptionalIntegrationMods')
    dependsOn tasks.named('optionalIntegrationFixtureJar')
    dependsOn tasks.named('assemble')
    def explicitServerDirectory = providers.gradleProperty('optionalIntegrationServerDir')
    if (explicitServerDirectory.isPresent()
            && file(explicitServerDirectory.get()).canonicalFile
                    != optionalIntegrationRunDirectory.asFile.canonicalFile) {
        from optionalIntegrationSourceModsDirectory
    }
    from optionalIntegrationFixtureJarFile
    from layout.buildDirectory.file(
            "libs/${base.archivesName.get()}-${project.version}.jar")
    into optionalIntegrationServerModsDirectory
}

tasks.register('runOptionalIntegrationServer', Exec) {
    group = 'verification'
    description = 'Runs the packaged Forge server and proves all optional recipes are loaded.'
    dependsOn tasks.named('stageOptionalIntegrationFixture')
    doFirst {
        File serverDirectory = optionalIntegrationServerDirectory.get()
        File probeWorld = new File(serverDirectory, 'world')
        if (probeWorld.exists() && !project.delete(probeWorld)) {
            throw new GradleException("Could not reset optional-integration probe world ${probeWorld}")
        }
        File marker = new File(serverDirectory, 'optional-integration-pass.properties')
        if (marker.exists() && !marker.delete()) {
            throw new GradleException("Could not remove stale optional-integration marker ${marker}")
        }
        new File(serverDirectory, 'eula.txt').setText('eula=true\n', 'UTF-8')
        new File(serverDirectory, 'server.properties').setText([
                'allow-flight=true',
                'level-name=world',
                'max-tick-time=120000',
                'online-mode=false',
                'server-ip=127.0.0.1',
                'server-port=0',
                ''
        ].join('\n'), 'UTF-8')
        String argumentFileName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
                .contains('windows') ? 'win_args.txt' : 'unix_args.txt'
        File argumentFile = new File(serverDirectory,
                "libraries/net/minecraftforge/forge/${minecraft_version}-${forge_version}/" +
                        argumentFileName)
        File userArguments = new File(serverDirectory, 'user_jvm_args.txt')
        if (!argumentFile.isFile() || !userArguments.isFile()) {
            throw new GradleException("Install the Forge ${minecraft_version}-${forge_version} " +
                    "server in ${serverDirectory} before running this test")
        }
        workingDir serverDirectory
        executable java16Launcher.get().executablePath.asFile
        args '@user_jvm_args.txt', "@${argumentFile.toPath().toString()}", 'nogui'
    }
    doLast {
        File marker = new File(optionalIntegrationServerDirectory.get(),
                'optional-integration-pass.properties')
        if (!marker.isFile()) {
            throw new GradleException('Optional-integration server exited without a passing probe marker')
        }
        Properties result = new Properties()
        marker.withInputStream { result.load(it) }
        int expectedConditionalRecipes = optionalIntegrationExpectedCounts.values()
                .sum { it.recipes } as int
        int expectedConditionalAdvancements = optionalIntegrationExpectedCounts.values()
                .sum { it.advancements } as int
        if (result.getProperty('status') != 'PASS'
                || result.getProperty('conditional_recipes_loaded') != expectedConditionalRecipes.toString()
                || result.getProperty('conditional_advancements_loaded') != expectedConditionalAdvancements.toString()) {
            throw new GradleException("Unexpected optional-integration result ${result}")
        }
    }
}
