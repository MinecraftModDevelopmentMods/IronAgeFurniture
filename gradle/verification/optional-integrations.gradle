def java16Compiler = buildSupport.java16Compiler
def java16Launcher = buildSupport.java16Launcher
def sha256Of = buildSupport.sha256Of
def optionalIntegrationExpectedCounts = buildSupport.optionalIntegrationExpectedCounts
def expectedReleaseFiles = buildSupport.expectedReleaseFiles
def preparedReleaseDir = buildSupport.preparedReleaseDir
def expectedMavenGroup = buildSupport.expectedMavenGroup
def expectedMavenArtifact = buildSupport.expectedMavenArtifact
def expectedMavenCoordinate = buildSupport.expectedMavenCoordinate
def eclipseWorkspaceProjectName = buildSupport.eclipseWorkspaceProjectName
def archiveTextPatterns = buildSupport.archiveTextPatterns
def archiveTextSuffixes = buildSupport.archiveTextSuffixes
