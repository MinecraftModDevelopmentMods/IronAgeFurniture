    group = 'verification'
    description = 'Verifies the exact IronAgeFurniture 1.12.2 release identity.'
    dependsOn tasks.named('verifyMavenizerCompatibilityFixture')
    doLast {
        Map<String, String> expected = [
                mod_version            : '0.4.0.112021',
                mod_group              : 'zone.moddev.mc',
                mod_archive_name       : 'iron-age-furniture',
                mod_id                 : 'ironagefurniture',
                minecraft_version      : '1.12.2',
                loader_name            : 'forge',
                loader_code            : '1',
                forge_version          : '14.23.5.2859',
                forge_version_range    : '[14.23.5.2859,15)',
                loader_version_range   : '[14,)',
                mcp_mappings_channel   : 'stable',
                mcp_mappings_version   : '39-1.12',
                java_version           : '8',
                java_toolchain_version : '8.0.502+7',
                gradle_java_version    : '17',
                curseforge_project_id  : '341834',
