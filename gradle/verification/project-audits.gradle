import groovy.json.JsonSlurper
import java.nio.charset.StandardCharsets

def archiveTextSuffixes = iafBuild.archiveTextSuffixes
def expectedMavenGroup = iafBuild.expectedMavenGroup
def expectedMavenArtifact = iafBuild.expectedMavenArtifact

// Keep release identity, resources and repository contents honest on every check.
