import groovy.xml.XmlSlurper

// Eclipse runs the processed production classes and resources, not test output.
def prepareEclipseResources = tasks.register('prepareEclipseResources', Sync) {
    group = 'ide'
    description = 'Synchronises compiled production classes and processed resources into Eclipse bin/main.'
    dependsOn tasks.named('classes')
    from sourceSets.main.output
    into layout.projectDirectory.dir('bin/main')
}

eclipse {
    synchronizationTasks 'prepareEclipseResources'
}

tasks.named('eclipse').configure {
    dependsOn prepareEclipseResources
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        if (preferencesFile.isFile()) preferencesFile.withInputStream { preferences.load(it) }
        String gradleHome = gradle.gradleUserHomeDir.canonicalPath
        String javaHome = java21Launcher.get().metadata.installationPath.asFile.canonicalPath
        preferences.setProperty('eclipse.preferences.version', '1')
        preferences.setProperty('connection.gradle.distribution', 'GRADLE_DISTRIBUTION(WRAPPER)')
        preferences.setProperty('override.workspace.settings', 'true')
        preferences.setProperty('gradle.user.home', gradleHome)
        preferences.setProperty('connection.gradle.user.home', gradleHome)
        preferences.setProperty('java.home', javaHome)
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream {
            preferences.store(it, 'Generated by IronAgeFurniture for its NeoGradle Eclipse import.')
        }
        File resourcePreferencesFile = file('.settings/org.eclipse.core.resources.prefs')
        Properties resourcePreferences = new Properties()
        if (resourcePreferencesFile.isFile()) {
            resourcePreferencesFile.withInputStream { resourcePreferences.load(it) }
        }
        resourcePreferences.setProperty('eclipse.preferences.version', '1')
        resourcePreferences.setProperty('encoding/<project>', 'UTF-8')
        resourcePreferencesFile.withOutputStream {
            resourcePreferences.store(it, 'Generated by IronAgeFurniture for its Eclipse import.')
        }
    }
}

tasks.register('prepareEclipse') {
    group = 'ide'
    description = 'Creates the Buildship project model and NeoGradle launch profiles.'
    dependsOn tasks.named('eclipse')
}

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    dependsOn tasks.named('eclipse')
    doLast {
        File prefs = file('.settings/org.eclipse.buildship.core.prefs')
        if (!prefs.isFile()) throw new GradleException('Missing Buildship preferences')
        Properties preferences = new Properties()
        prefs.withInputStream { preferences.load(it) }
        if (preferences.getProperty('override.workspace.settings') != 'true') {
            throw new GradleException('Eclipse Buildship workspace override is not active')
        }
        String expectedJavaHome = java21Launcher.get().metadata.installationPath.asFile.canonicalPath
        String configuredJavaHome = preferences.getProperty('java.home', '')
        if (configuredJavaHome.isEmpty()
                || file(configuredJavaHome).canonicalPath != expectedJavaHome) {
            throw new GradleException("Eclipse Buildship must use Java 21 at ${expectedJavaHome}")
        }
        File resourcePrefs = file('.settings/org.eclipse.core.resources.prefs')
        Properties resourcePreferences = new Properties()
        if (!resourcePrefs.isFile()) throw new GradleException('Missing Eclipse resource preferences')
        resourcePrefs.withInputStream { resourcePreferences.load(it) }
        if (resourcePreferences.getProperty('encoding/<project>') != 'UTF-8') {
            throw new GradleException('Eclipse project encoding must be UTF-8')
        }
        File eclipseClasspath = file('.classpath')
        File eclipseProject = file('.project')
        if (!eclipseClasspath.isFile() || !eclipseProject.isFile()
                || !eclipseProject.getText('UTF-8').contains("<name>${eclipseWorkspaceProjectName}</name>")) {
            throw new GradleException('Eclipse project metadata is missing or misnamed')
        }
        String classpathText = eclipseClasspath.getText('UTF-8')
        if (!classpathText.contains('path="build/resources/main"')
                || classpathText.contains('path="src/main/resources"')
                || classpathText.contains('path="src/generated/resources"')) {
            throw new GradleException('Eclipse must consume only Gradle-processed production resources')
        }
        def classpathXml = new XmlSlurper(false, false).parse(eclipseClasspath)
        if (classpathXml.classpathentry.any { entry ->
            [entry.@path.text(), entry.@output.text()].any { path ->
                path.contains('phaseFourTest') || path.contains('iaf-phase-four-probes')
            }
        })
            throw new GradleException('Eclipse production classpath exposes the development probe mod')
        if (!file('bin/main/zone/moddev/mc/ironagefurniture/Ironagefurniture.class').isFile()
                || !fileTree('bin/main') {
                    include 'zone/moddev/mc/ironagefurniture/fixture/**', 'iaf-client-probes.mixins.json'
                }.isEmpty())
            throw new GradleException('Eclipse output must contain production classes without development probes')
        List<String> libraryEntries = classpathXml.classpathentry
                .findAll { it.@kind.text() == 'lib' }
                .collect { it.@path.text().replace('\\', '/').toLowerCase(Locale.ROOT) }
        Set<String> duplicateLibraries = libraryEntries.findAll { path ->
            libraryEntries.count { it == path } > 1
        } as Set<String>
        if (!duplicateLibraries.isEmpty()) {
            throw new GradleException("Eclipse classpath contains duplicate libraries: ${duplicateLibraries}")
        }
        if (!classpathXml.classpathentry.any { entry ->
            entry.@kind.text() == 'con' && entry.@path.text().endsWith('/JavaSE-21/')
        }) {
            throw new GradleException('Eclipse classpath is not bound to the JavaSE-21 execution environment')
        }
        ['META-INF/neoforge.mods.toml',
         'META-INF/ironagefurniture/docs/README.md',
         'META-INF/ironagefurniture/docs/VERSIONS.md'].each { relative ->
            if (!new File('bin/main', relative).isFile()) {
                throw new GradleException("Eclipse output is missing ${relative}")
            }
        }
        String metadataText = file('bin/main/META-INF/neoforge.mods.toml').getText('UTF-8')
        if (metadataText.contains('${version}')
                || !metadataText.contains("version=\"${project.version}\"")) {
            throw new GradleException('Eclipse output contains unexpanded NeoForge metadata')
        }
        List<String> forbidden = [
                'src/test', 'bin/test', 'build/classes/java/test',
                'optionalIntegrationTest', 'junit-', 'hamcrest-',
                'net.minecraftforge', 'META-INF/mods.toml', 'ci-fixtures/tools',
                'phaseFourTest', 'iaf-phase-four-probes'
        ]
        fileTree(project.projectDir) { include 'run*.launch' }.files.each { launch ->
            List<String> leaked = forbidden.findAll { launch.getText('UTF-8').contains(it) }
            if (!leaked.isEmpty()) {
                throw new GradleException("${launch.name} exposes test/Forge/build-fixture content: ${leaked}")
            }
        }
    }
}
