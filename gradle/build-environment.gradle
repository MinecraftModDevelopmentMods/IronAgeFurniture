// The daemon criteria select Java 25 before this script is evaluated, even
// when Buildship runs inside an Eclipse installation using Java 21.
if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_25)) {
    throw new GradleException("Gradle requires Java 25 or newer, found ${System.getProperty('java.version')}")
}

