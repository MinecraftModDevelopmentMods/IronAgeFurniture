tasks.register('verifyBuildEnvironment') {
    group = 'verification'
    description = 'Verifies the supported Gradle runtime and exact Java 25 compiler toolchain.'
    inputs.file layout.projectDirectory.file('gradle/gradle-daemon-jvm.properties')
    doLast {
        Properties daemonCriteria = new Properties()
        file('gradle/gradle-daemon-jvm.properties').withInputStream { daemonCriteria.load(it) }
        if (daemonCriteria.getProperty('toolchainVersion') != project.gradle_java_version.toString()
                || daemonCriteria.getProperty('toolchainVendor') != 'ADOPTIUM'
                || daemonCriteria.keySet().any { it.toString().startsWith('toolchainUrl.') }) {
            throw new GradleException('Gradle daemon criteria must select a local Adoptium Java 25 without download URLs')
        }
        def metadata = java25Compiler.get().metadata
        String actual = metadata.javaRuntimeVersion.toString()
        String normalizedActual = actual.replaceFirst(/-LTS$/, '')
        if (normalizedActual != project.java_toolchain_version.toString()
                || !metadata.vendor.toString().toLowerCase(Locale.ROOT).contains('temurin')) {
            throw new GradleException("Java compiler toolchain must be ${project.java_toolchain_version}; " +
                    "found ${metadata.vendor} ${actual} at ${metadata.installationPath}")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('verifyBuildEnvironment')
}

ext.processedMainResourcesDirectory = { sourceSets.main.output.resourcesDir }
ext.processedMainResourcesPath = {
    project.relativePath(processedMainResourcesDirectory()).replace('\\', '/')
}

ext.eclipseWorkspaceProjectName = 'IronAgeFurniture'
eclipse {
    project {
        name = eclipseWorkspaceProjectName
        buildCommand 'org.eclipse.buildship.core.gradleprojectbuilder'
        natures 'org.eclipse.buildship.core.gradleprojectnature'
    }
    classpath {
        downloadSources = true
        downloadJavadoc = true
        defaultOutputDir = file('bin/default')
        file.whenMerged { classpath ->
            classpath.entries.findAll { entry ->
                entry instanceof org.gradle.plugins.ide.eclipse.model.Output
            }.each { entry -> entry.path = 'bin/default' }
            classpath.entries.removeAll { entry ->
                entry instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder
                        && ['src/main/resources', 'src/generated/resources'].contains(entry.path)
            }
            String resourcesPath = processedMainResourcesPath()
            if (!classpath.entries.any { entry -> entry.path == resourcesPath }) {
                classpath.entries.add(new org.gradle.plugins.ide.eclipse.model.SourceFolder(
                        resourcesPath, 'bin/main'))
            }
            classpath.entries.findAll { entry ->
                entry instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder
            }.each { entry ->
                if (entry.path == 'src/main/java' || entry.path == resourcesPath) {
                    entry.output = 'bin/main'
                } else if (entry.path.startsWith('src/test/')) {
                    entry.output = 'bin/test'
                }
            }
        }
    }
    synchronizationTasks 'isolateEclipseProductionRuns'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

minecraft {
    mappings channel: project.mcp_mappings_channel, version: project.mcp_mappings_version

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir(
                    providers.gradleProperty('runDirectory').getOrElse('run'))
            jvmArgs '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            if (!providers.gradleProperty('packagedRuntime').map { it.toBoolean() }.getOrElse(false)) {
                mods { ironagefurniture { source sourceSets.main } }
            }
        }
        register('client')
        register('server') {
            args '--nogui'
        }
        register('data') {
            workingDir.convention layout.projectDirectory.dir('run-data')
            args '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

ext.developmentModOutput = layout.buildDirectory.dir('forge-run-mod-classes/main')
ext.prepareDevelopmentMod = tasks.register('prepareDevelopmentMod', Sync) {
    group = 'ide'
    description = 'Merges production classes and resources for Forge 66 development discovery.'
    dependsOn tasks.named('classes')
    from sourceSets.main.output.classesDirs
    from sourceSets.main.output.resourcesDir
    into developmentModOutput
}

tasks.withType(JavaExec).configureEach { JavaExec runTask ->
    if (['runClient', 'runServer', 'runData'].contains(runTask.name)) {
        runTask.dependsOn prepareDevelopmentMod
        runTask.doFirst {
            Set<String> splitOutputs = sourceSets.main.output.files.collect {
                it.canonicalFile.absolutePath
            } as Set
            Collection<File> targetClasspath = runTask.classpath.files.findAll {
                !splitOutputs.contains(it.canonicalFile.absolutePath)
            }
            boolean packaged = providers.gradleProperty('packagedRuntime').map { it.toBoolean() }.getOrElse(false)
            runTask.classpath = packaged ? files(targetClasspath) : files(developmentModOutput, targetClasspath)
            runTask.environment 'MOD_CLASSES', packaged ? '' : "${project.mod_id}%%${developmentModOutput.get().asFile}"
            if (packaged && providers.gradleProperty('launchManifest').isPresent()) {
                File manifest = file(providers.gradleProperty('launchManifest').get()).canonicalFile
                if (manifest.toPath().startsWith(projectDir.canonicalFile.toPath()))
                    throw new GradleException('Keep packaged launch receipts outside the checkout')
                manifest.parentFile.mkdirs()
                manifest.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                    java: runTask.executable, main: runTask.mainClass.get(),
                    directory: runTask.workingDir.absolutePath,
                    classpath: runTask.classpath.files.collect { it.absolutePath },
                    jvmArgs: runTask.allJvmArgs.collect { it.toString() },
                    args: runTask.args.collect { it.toString() },
                    environment: ['MOD_CLASSES': '']
                ])) + '\n', 'UTF-8')
            }
            File modsDirectory = new File(runTask.workingDir, 'mods')
            if (!modsDirectory.isDirectory() && !modsDirectory.mkdirs()) {
                throw new GradleException("Could not create development mods directory: ${modsDirectory}")
            }
        }
    }
}

